
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<title>KB×AERIAL — prod v4</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0c10">
<style>
  html,body{ margin:0; height:100%; background:#0b0c0f; }
  #kbFrame{ position:fixed; inset:0; border:0; width:100%; height:100%; }
  #panel{ position:fixed; right:16px; bottom:16px; width:min(520px,96vw); height:min(70vh,560px);
           background:#000; border:1px solid #2a2a33; border-radius:14px; overflow:hidden;
           box-shadow:0 16px 48px rgba(0,0,0,.5); display:none; z-index:20; }
  #drag{ position:absolute; inset:0 0 auto 0; height:24px; background:#111114; color:#9aa0a6; font:12px/24px ui-sans-serif; padding-left:10px; cursor:move; z-index:21; }
  #aerialFrame{ position:absolute; inset:24px 0 0 0; width:100%; height:calc(100% - 24px); border:0; background:#0b0d11; }
  #hint{ position:fixed; right:10px; top:10px; font:600 12px ui-sans-serif; color:#cfd3ff; opacity:.85; background:#111114cc; padding:6px 8px; border-radius:10px; border:1px solid #2a2a33; z-index:30; }
</style>
</head>
<body>
  <iframe id="kbFrame" src="./kb/index.html?v=4" allow="fullscreen"></iframe>
  <div id="panel">
    <div id="drag">操作パネル（✌ 二本指長押しで表示/非表示・ドラッグ移動）</div>
    <iframe id="aerialFrame" src="./aerial/hum-theremin-recorder-nosw.html?v=22.2" allow="autoplay; microphone; fullscreen"></iframe>
  </div>
  <div id="hint">✌ 二本指長押しで操作パネル ／ 高い音ほど図形が大きく・低いと戻る</div>

<script>
if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js"); }

const panel=document.getElementById('panel'), hint=document.getElementById('hint');
const kbFrame=document.getElementById('kbFrame'), aerialFrame=document.getElementById('aerialFrame');
function setPanel(show){ panel.style.display=show?'block':'none'; if(hint) hint.style.opacity=show?0.6:0.9; }
function togglePanel(){ setPanel(panel.style.display!=='block'); }
setPanel(true); setTimeout(()=>setPanel(false), 1800);

// Two-finger long-press (pointer + touch)
(function(){
  const active=new Map(); let holdTimer=null;
  const cancelHold=()=>{ if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } };
  const moved=(p,e)=> Math.abs(e.clientX-p.x)>20 || Math.abs(e.clientY-p.y)>20;

  document.addEventListener('pointerdown', e=>{ active.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(active.size>=2 && !holdTimer) holdTimer=setTimeout(()=>togglePanel(),800); if(active.size>=2) e.preventDefault(); }, {capture:true, passive:false});
  document.addEventListener('pointermove', e=>{ const p=active.get(e.pointerId); if(p && moved(p,e)) cancelHold(); if(active.size>=2) e.preventDefault(); }, {capture:true, passive:false});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{ document.addEventListener(ev, e=>{ active.delete(e.pointerId); cancelHold(); }, {capture:true, passive:false}); });

  let tc=0, tPts=[], tTimer=null; const tCancel=()=>{ if(tTimer){ clearTimeout(tTimer); tTimer=null; } };
  document.addEventListener('touchstart', e=>{ tc=e.touches.length; tPts=Array.from(e.touches).map(t=>({x:t.clientX,y:t.clientY})); if(tc>=2 && !tTimer){ tTimer=setTimeout(()=>togglePanel(),800); e.preventDefault(); } }, {capture:true, passive:false});
  document.addEventListener('touchmove', e=>{ if(tc>=2){ const mv=Array.from(e.touches).some((t,i)=>{ const p=tPts[i]||tPts[0]; return Math.abs(t.clientX-p.x)>20||Math.abs(t.clientY-p.y)>20; }); if(mv) tCancel(); e.preventDefault(); } }, {capture:true, passive:false});
  document.addEventListener('touchend', ()=>{ tCancel(); tc=0; }, {capture:true, passive:false});
  document.addEventListener('touchcancel', ()=>{ tCancel(); tc=0; }, {capture:true, passive:false});
})();

// Branding mask
aerialFrame.addEventListener('load', ()=>{ try{ const d=aerialFrame.contentDocument; const st=d.createElement('style'); st.textContent='h1, header, [class*=title], [class*=header], [data-brand]{display:none!important;} body{font-family:system-ui,\'Noto Sans JP\',sans-serif;}'; d.head.appendChild(st); }catch(_ ){} });

// Inject two-finger into iframes
function injectTwoFinger(frameEl, msgType){ if(!frameEl) return; frameEl.addEventListener('load', ()=>{ try{ const d=frameEl.contentDocument; const st=d.createElement('style'); st.textContent='html,body,*{touch-action:none!important;-ms-touch-action:none!important;}'; d.head.appendChild(st); const s=d.createElement('script'); s.type='text/javascript'; s.text=`
  (function(){
    const active=new Map(); let timer=null;
    const cancel=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
    const moved=(p,e)=> Math.abs(e.clientX-p.x)>20 || Math.abs(e.clientY-p.y)>20;
    document.addEventListener('pointerdown', e=>{ active.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(active.size>=2 && !timer){ timer=setTimeout(()=>{ try{ parent.postMessage({type:"__MSG__"}, "*"); }catch{} },800); e.preventDefault(); e.stopImmediatePropagation(); return false; } }, {capture:true, passive:false});
    document.addEventListener('pointermove', e=>{ const p=active.get(e.pointerId); if(p && moved(p,e)) cancel(); if(active.size>=2){ e.preventDefault(); e.stopImmediatePropagation(); return false; } }, {capture:true, passive:false});
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{ document.addEventListener(ev, e=>{ active.delete(e.pointerId); cancel(); }, {capture:true, passive:false}); });
    let tc=0, tPts=[], tTimer=null; const tCancel=()=>{ if(tTimer){ clearTimeout(tTimer); tTimer=null; } };
    document.addEventListener('touchstart', e=>{ tc=e.touches.length; tPts=Array.from(e.touches).map(t=>({x:t.clientX,y:t.clientY})); if(tc>=2 && !tTimer){ tTimer=setTimeout(()=>{ try{ parent.postMessage({type:"__MSG__"}, "*"); }catch{} },800); e.preventDefault(); e.stopImmediatePropagation(); return false; } }, {capture:true, passive:false});
    document.addEventListener('touchmove', e=>{ if(tc>=2){ const mv=Array.from(e.touches).some((t,i)=>{ const p=tPts[i]||tPts[0]; return Math.abs(t.clientX-p.x)>20||Math.abs(t.clientY-p.y)>20; }); if(mv) tCancel(); e.preventDefault(); e.stopImmediatePropagation(); return false; } }, {capture:true, passive:false});
    document.addEventListener('touchend', ()=>{ tCancel(); tc=0; }, {capture:true, passive:false});
    document.addEventListener('touchcancel', ()=>{ tCancel(); tc=0; }, {capture:true, passive:false});
  })();
`; s.text = s.text.replace(/__MSG__/g, msgType); d.head.appendChild(s); }catch(_ ){} }); }
injectTwoFinger(kbFrame, 'KB_TWO_FINGER');
injectTwoFinger(aerialFrame, 'AERIAL_TWO_FINGER');

window.addEventListener('message', (e)=>{ if(e?.data?.type==='KB_TWO_FINGER' || e?.data?.type==='AERIAL_TWO_FINGER') togglePanel(); });

// Pitch bridge into AERIAL
aerialFrame.addEventListener('load', ()=>{ try{ const d=aerialFrame.contentDocument; const s=d.createElement('script'); s.type='text/javascript'; s.text=`
  (function(){
    let analyser=null, hooked=false, ctx=null;
    function loop(a, ctx){ const N=2048, buf=new Float32Array(N), sr=ctx.sampleRate||48000;
      const step=()=>{ a.getFloatTimeDomainData(buf); let rms=0; for(let i=0;i<N;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/N);
        if(rms>0.004){ let mean=0; for(let i=0;i<N;i++) mean+=buf[i]; mean/=N; for(let i=0;i<N;i++) buf[i]-=mean;
          let best=-1, bc=0; for(let off=20; off<N/2; off++){ let c=0; for(let i=0;i<N-off;i++) c+=buf[i]*buf[i+off]; c/=(N-off); if(c>bc){ bc=c; best=off; } }
          if(best>0){ const hz=sr/best; try{ parent.postMessage({type:'AERIAL_PITCH_HZ', hz}, '*'); }catch{} }
        }
        requestAnimationFrame(step);
      }; requestAnimationFrame(step); }
    function hook(){ const cs=[window.masterGain, window.master, window.MainGain, window.master_out, window.gMaster];
      for(const g of cs){ try{ if(g && g.context && g.gain){ ctx=g.context; const tee=ctx.createGain(); tee.gain.value=1; try{ g.disconnect(); }catch{} g.connect(tee); tee.connect(ctx.destination); analyser=ctx.createAnalyser(); analyser.fftSize=2048; tee.connect(analyser); hooked=true; loop(analyser, ctx); return true; } }catch{} } return false; }
    if(!hook()){ const _c=AudioNode.prototype.connect; AudioNode.prototype.connect=function(){ try{ const ctx=this.context; for(let i=0;i<arguments.length;i++){ if(arguments[i]===ctx.destination && !hooked){ const tee=ctx.createGain(); tee.gain.value=1; _c.call(this, tee); _c.call(tee, ctx.destination); analyser=ctx.createAnalyser(); analyser.fftSize=2048; _c.call(tee, analyser); hooked=true; loop(analyser, ctx); return; } } }catch{} return _c.apply(this, arguments); }; }
  })();
`; d.head.appendChild(s); }catch(_ ){} });

// Parent: pitch -> KB size (shrink follows)
const FMIN=120, FMAX=1800, ATTACK=0.75, RELEASE=0.55, STEP_UP_MAX=0.15, STEP_DOWN_MAX=0.12;
let env=0, prevTarget=0, med=[];
function hz2norm(hz){ const c=Math.max(FMIN, Math.min(FMAX, hz||FMIN)); return (Math.log(c)-Math.log(FMIN))/(Math.log(FMAX)-Math.log(FMIN)); }
function applyPitch(hz){ let n=hz2norm(hz); med.push(n); if(med.length>5) med.shift(); const mid=[...med].sort((a,b)=>a-b)[Math.floor(med.length/2)];
  const up=Math.min(mid-prevTarget, STEP_UP_MAX), dn=Math.max(mid-prevTarget, -STEP_DOWN_MAX);
  const target=(mid>=prevTarget)? (prevTarget+up):(prevTarget+dn);
  const coeff=(target>=env)? ATTACK:RELEASE;
  env = env + (target-env)*coeff;
  prevTarget=target;
  try{ kbFrame.contentWindow.postMessage({type:'PITCH_NORM', v: env}, '*'); }catch(_ ){}
}
window.addEventListener('message', (e)=>{ if(e?.data?.type==='AERIAL_PITCH_HZ' && typeof e.data.hz==='number' && e.data.hz>0) applyPitch(e.data.hz); });

// Drag panel
(function(){ const drag=document.getElementById('drag'); let sx=0, sy=0, ox=0, oy=0, on=false;
  drag.addEventListener('pointerdown', (e)=>{ on=true; drag.setPointerCapture(e.pointerId); const r=panel.getBoundingClientRect(); ox=r.left; oy=r.top; sx=e.clientX; sy=e.clientY; document.body.style.cursor='grabbing'; });
  drag.addEventListener('pointermove', (e)=>{ if(!on) return; const dx=e.clientX-sx, dy=e.clientY-sy; panel.style.left=Math.max(8, Math.min(innerWidth-panel.offsetWidth-8, ox+dx))+'px'; panel.style.top=Math.max(8, Math.min(innerHeight-panel.offsetHeight-8, oy+dy))+'px'; panel.style.right='auto'; panel.style.bottom='auto'; });
  const end=()=>{ on=false; document.body.style.cursor=''; }; drag.addEventListener('pointerup', end); drag.addEventListener('pointercancel', end);
})();
</script>
</body>
</html>
