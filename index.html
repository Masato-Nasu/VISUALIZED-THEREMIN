<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Motion Theremin (Stable)</title>
<meta name="theme-color" content="#111317">
<link rel="manifest" href="./manifest.json?v=20251018052749">
<style>
  :root { --fg:#eaeaea; --muted:#9aa0a6; --accent:#60a5fa; --bg:#111317; }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Helvetica Neue","Noto Sans JP",sans-serif}
  #stage{position:fixed;inset:0;display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
  #topbar{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:10}
  .btn{border:1px solid #ffffff22; background:#ffffff0f; color:var(--fg); padding:8px 10px; border-radius:10px; cursor:pointer; font-weight:600}
  #status{margin-left:auto;font-size:12px;color:var(--muted)}
  .panel{position:fixed;left:10px;right:10px;bottom:10px;display:grid;gap:6px;background:#00000040;border:1px solid #ffffff14;border-radius:12px;padding:10px;backdrop-filter:blur(6px)}
  label{font-size:12px;color:var(--muted)}
  input[type="range"]{width:100%}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="topbar">
  <button id="start" class="btn">タップして開始（音を解放）</button>
  <button id="perm" class="btn">センサー許可</button>
  <button id="bgmToggle" class="btn">BGM 再生/一時停止</button>
  <button id="audioResume" class="btn">Audio再開</button>
  <button id="testBeep" class="btn">テストビープ</button>
  <div id="status">SENS:— ｜ AUDIO:— ｜ FREQ:— Hz ｜ VOL:— ｜ v:20251018052749</div>
</div>

<div class="panel">
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <div style="min-width:150px"><label>Master 音量</label><input id="volMaster" type="range" min="0" max="1" step="0.001" value="0.8"></div>
    <div style="min-width:150px"><label>Theremin 音量</label><input id="volTheremin" type="range" min="0" max="1" step="0.001" value="0.6"></div>
    <div style="min-width:150px"><label>BGM 音量</label><input id="volBgm" type="range" min="0" max="1" step="0.001" value="0.5"></div>
    <div style="min-width:150px"><label>チャイム 音量</label><input id="volChime" type="range" min="0" max="1" step="0.001" value="0.8"></div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
    <input id="musicFile" type="file" accept="audio/*">
    <label style="display:flex;align-items:center;gap:6px"><input id="bgmLoop" type="checkbox" checked> ループ</label>
    <label style="display:flex;align-items:center;gap:6px"><input id="mouseMode" type="checkbox"> マウス操作</label>
    <label style="display:flex;align-items:center;gap:6px"><input id="forceAccel" type="checkbox"> フォールバック固定</label>
  </div>
  <div style="font-size:12px;color:var(--muted)">ドラッグ：縦=ピッチ（上=低/下=高）、横=音量（左=小/右=大）。センサー無い環境では自動でマウス操作に切替。</div>
</div>

<audio id="bgm" preload="none" crossorigin="anonymous"></audio>

<script>
// SW
if("serviceWorker" in navigator){ addEventListener("load",()=>{ navigator.serviceWorker.register("./sw.js?ver=20251018052749").catch(()=>{}); }); }

// Canvas
const canvas=document.getElementById('stage'); const ctx=canvas.getContext('2d',{alpha:false});
function resize(){ const dpr=Math.min(2,window.devicePixelRatio||1); canvas.width=Math.floor(innerWidth*dpr); canvas.height=Math.floor(innerHeight*dpr); canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize',resize,{passive:true}); resize();

// Audio graph
let actx, master, gainTh, gainBgm, gainCh, osc, analyser;
let freq=440;
const statusEl=document.getElementById('status');
function updateStatus(sens){ const st=actx?actx.state.toUpperCase():'—'; const v=(gainTh?gainTh.gain.value:0).toFixed(3); statusEl.textContent=`SENS:${sens||currSens} ｜ AUDIO:${st} ｜ FREQ:${freq.toFixed(1)} Hz ｜ VOL:${v} ｜ v:20251018052749`; }

function setupAudio(){
  if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain(); master.gain.value=Number(volMaster.value); master.connect(actx.destination);
  analyser=actx.createAnalyser(); analyser.fftSize=512; analyser.connect(master);
  gainTh=actx.createGain(); gainTh.gain.value=Number(volTheremin.value);
  gainBgm=actx.createGain(); gainBgm.gain.value=Number(volBgm.value);
  gainCh =actx.createGain(); gainCh .gain.value=Number(volChime.value);
  osc=actx.createOscillator(); osc.type='sine'; osc.frequency.value=freq; osc.connect(gainTh).connect(analyser);
  gainBgm.connect(analyser); gainCh.connect(analyser);
  osc.start();
  updateStatus();
}
async function ensureAudio(){ if(!actx) setupAudio(); if(actx.state!=='running') try{ await actx.resume(); }catch(e){} updateStatus(); }

// Sliders direct-wire
const volMaster=document.getElementById('volMaster');
const volTheremin=document.getElementById('volTheremin');
const volBgm=document.getElementById('volBgm');
const volChime=document.getElementById('volChime');
volMaster.addEventListener('input',()=>{ if(master) master.gain.value=Number(volMaster.value); updateStatus(); });
volTheremin.addEventListener('input',()=>{ if(gainTh) gainTh.gain.value=Number(volTheremin.value); updateStatus(); });
volBgm.addEventListener('input',()=>{ if(gainBgm) gainBgm.gain.value=Number(volBgm.value); });
volChime.addEventListener('input',()=>{ if(gainCh)  gainCh .gain.value=Number(volChime.value); });

// BGM
const bgmEl=document.getElementById('bgm'); let bgmSrc=null;
function connectBgm(){ if(!actx) return; if(bgmSrc) try{bgmSrc.disconnect();}catch(e){} bgmSrc=actx.createMediaElementSource(bgmEl); bgmSrc.connect(gainBgm); }
document.getElementById('musicFile').addEventListener('change',e=>{ const f=e.target.files?.[0]; if(!f) return; const url=URL.createObjectURL(f); bgmEl.src=url; bgmEl.loop=document.getElementById('bgmLoop').checked; connectBgm(); bgmEl.play().catch(()=>{}); });
document.getElementById('bgmLoop').addEventListener('change',e=>{ bgmEl.loop=e.target.checked; });
document.getElementById('bgmToggle').addEventListener('click',()=>{ ensureAudio(); connectBgm(); if(bgmEl.paused) bgmEl.play().catch(()=>{}); else bgmEl.pause(); });

// Buttons
document.getElementById('start').addEventListener('click',ensureAudio);
document.getElementById('audioResume').addEventListener('click',ensureAudio);
['pointerdown','touchstart','keydown'].forEach(evt=>addEventListener(evt,ensureAudio,{passive:true}));
document.getElementById('testBeep').addEventListener('click', async()=>{ await ensureAudio(); const o=actx.createOscillator(); const g=actx.createGain(); o.type='sine'; o.frequency.value=880; g.gain.value=0; o.connect(g).connect(master); const t=actx.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.6,t+0.01); g.gain.linearRampToValueAtTime(0.0,t+0.06); o.start(t); o.stop(t+0.08); });

// Sensors + Mouse fallback
let currSens='—', useAccelFallback=false, oriCnt=0, motCnt=0;
const mouseMode=document.getElementById('mouseMode'); const forceAccel=document.getElementById('forceAccel');

function applyAngles(beta,gamma){
  const betaNorm=Math.min(1,Math.max(0,(beta+180)/360)); const betaCurve=Math.sin(betaNorm*Math.PI);
  freq=110 + betaCurve*(1200-110);
  const gammaNorm=Math.min(1,Math.max(0,(Math.abs(gamma)/90))); const vshape=Math.pow(gammaNorm,0.7);
  if(osc) osc.frequency.setTargetAtTime(freq, actx.currentTime, 0.02);
  if(gainTh){ const base=Number(volTheremin.value); gainTh.gain.setTargetAtTime(base*(mouseMode.checked?1:vshape), actx.currentTime, 0.03); }
  draw(); updateStatus();
}
function handleOrientation(ev){ if(ev.beta==null||ev.gamma==null) return; oriCnt++; currSens='OK'; applyAngles(ev.beta, ev.gamma); }
function handleMotion(ev){
  motCnt++; if(oriCnt===0 || useAccelFallback){ currSens='ACCEL';
    const a=ev.accelerationIncludingGravity||{x:0,y:0,z:0}; const ax=a.x||0, ay=a.y||0, az=a.z||0;
    const pitch=Math.atan2(ax, Math.hypot(ay,az))*180/Math.PI; const roll=Math.atan2(ay, Math.hypot(ax,az))*180/Math.PI;
    applyAngles(pitch, roll);
  }
}
addEventListener('deviceorientation', handleOrientation, {passive:true});
addEventListener('deviceorientationabsolute', handleOrientation, {passive:true});
addEventListener('devicemotion', handleMotion, {passive:true});

// Mouse control
let dragging=false;
function mapFromCanvas(px,py){
  const r=canvas.getBoundingClientRect();
  const x=(px-r.left)/r.width, y=(py-r.top)/r.height;
  const gamma=(x-0.5)*180; const beta=(y-0.5)*360;
  const volNorm=Math.min(1,Math.max(0,(gamma+90)/180));
  const betaNorm=Math.min(1,Math.max(0,(beta+180)/360));
  const f=110 + Math.sin(betaNorm*Math.PI)*(1200-110);
  return {f, v:volNorm};
}
function handlePointer(e){
  const p=e.touches?e.touches[0]:e; const m=mapFromCanvas(p.clientX,p.clientY);
  freq=m.f; const base=Number(volTheremin.value); const out=base*m.v;
  if(osc) osc.frequency.setTargetAtTime(freq, actx.currentTime, 0.02);
  if(gainTh) gainTh.gain.setTargetAtTime(out, actx.currentTime, 0.03);
  currSens='MOUSE'; draw(); updateStatus();
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; ensureAudio(); handlePointer(e); });
canvas.addEventListener('pointermove',e=>{ if(dragging) handlePointer(e); });
addEventListener('pointerup',()=> dragging=false);
canvas.addEventListener('touchstart',e=>{ dragging=true; ensureAudio(); handlePointer(e); },{passive:true});
canvas.addEventListener('touchmove',e=>{ if(dragging) handlePointer(e); },{passive:true});
addEventListener('touchend',()=> dragging=false);

// Auto-enable mouse if no sensors
setTimeout(()=>{ if(oriCnt===0 && motCnt===0){ mouseMode.checked=true; currSens='MOUSE'; updateStatus(); }}, 1500);
forceAccel.addEventListener('change', e=>{ useAccelFallback=e.target.checked; });

// Visual
function draw(){
  const w=canvas.clientWidth,h=canvas.clientHeight,cx=w/2,cy=h/2;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const base=Number(volTheremin.value)||0.001; const rel=gainTh? (gainTh.gain.value/base) : 0;
  const rad=Math.min(w,h)*(0.18+0.18*rel); const time=performance.now()*0.001; const pulse=0.6+0.4*Math.sin(time*2+freq*0.002);
  ctx.fillStyle='rgba(96,165,250,0.12)'; ctx.strokeStyle='rgba(96,165,250,0.75)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,rad*(0.8+0.4*pulse),0,Math.PI*2); ctx.fill(); ctx.stroke();
}
(function loop(){ requestAnimationFrame(loop); draw(); })();

// Permission button
document.getElementById('perm').addEventListener('click', async()=>{
  try{
    if(window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission==='function') await DeviceMotionEvent.requestPermission();
    if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function') await DeviceOrientationEvent.requestPermission();
  }catch(e){}
});

// Boot
setupAudio(); updateStatus();
</script>
</body>
</html>
