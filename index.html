<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Baby Theremin Shapes — v1.7.2</title>
<link rel="manifest" href="./manifest.json?v=1.7.2">
<meta name="theme-color" content="#ffffff">
<style>
  :root{ --bg:#fafbfe; --panel:#ffffffcc; --text:#10121a; --muted:#6b7280; --stroke1:#1f2937; --stroke2:#ffffff; --glow:#8ab4f8; }
  :root.dark{ --bg:#0f1117; --panel:#20232bcc; --text:#E8EAF2; --muted:#8b90a1; --stroke1:#ffffff; --stroke2:#0f1117; --glow:#8ab4f8; }
  html,body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Roboto,"Noto Sans JP",sans-serif; overscroll-behavior:none; }
  #cv{ position:fixed; inset:0; width:100vw; height:100svh; display:block; touch-action:none; background:var(--bg);
      background-image: radial-gradient(ellipse at 20% 10%, #ffffff, transparent 60%), radial-gradient(ellipse at 80% 90%, #f0f4ff, transparent 60%); }
  .controls{ position:fixed; left:0; right:0; bottom:0; padding:12px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center;
    background:var(--panel); backdrop-filter:saturate(1.05) blur(8px); border-top-left-radius:16px; border-top-right-radius:16px;
    transition:opacity .2s ease, visibility .2s ease, transform .2s ease; transform:translateY(8px) }
  .controls *{ touch-action:manipulation }
  .controls.hidden{ opacity:0; visibility:hidden; pointer-events:none; transform:translateY(12px) }
  .btn{appearance:none;border:0;border-radius:14px;background:#2f6feb;color:#fff; padding:12px 16px;font-size:16px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .iconbtn{appearance:none;border:0;border-radius:12px;background:#0f1117; color:#fff; padding:10px 12px; font-size:14px; opacity:.9}
  .range,.select{display:inline-flex;align-items:center;gap:10px;background:#0f1117; color:#E8EAF2; border-radius:14px;padding:10px 12px; box-shadow:0 2px 8px rgba(0,0,0,.2)}
  input[type="range"]{width:160px}
  select{background:transparent;color:#E8EAF2;border:1px solid #222;padding:8px 10px;border-radius:10px}
  .starter{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; gap:14px; background:linear-gradient(180deg,#ffffffcc,#ffffff88);}
  .starter .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px; padding:22px 18px; box-shadow:0 10px 30px rgba(0,0,0,.08); text-align:center; color:#111}
  .starter .big{font-size:18px; margin-bottom:10px}
  .starter .startbtn{appearance:none;border:0;background:#10b981;color:#fff;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer}
  .closer{position:absolute;right:8px;top:-36px;background:#00000080;border:1px solid #ffffff22;color:#fff;padding:6px 10px;border-radius:10px}
  .theme{ position:fixed; right:10px; top:10px; z-index:5 }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- 明るさ/暗さ 切替 -->
<button id="theme" class="iconbtn theme">☀ 明るさ</button>

<!-- スタート画面（音の開始が必要な環境向け） -->
<div id="starter" class="starter">
  <div class="card">
    <div class="big">👶 Baby Theremin Shapes</div>
    <div>「はじめる」を押すと音が鳴ります。</div>
    <div style="margin-top:12px;">
      <button id="startbtn" class="startbtn">はじめる ▶</button>
    </div>
    <div style="margin-top:10px;font-size:12px;color:#6b7280;">短タップ：はじける ／ 長押し：テルミン</div>
  </div>
</div>

<div class="controls hidden" id="controls">
  <button id="closePanel" class="closer">× とじる</button>
  <label class="btn">🎵 おんがくフォルダ<input id="audDir" type="file" webkitdirectory directory multiple accept="audio/*" hidden></label>
  <div class="select">🎶 プリセット
    <select id="preset">
      <option value="none">（なし）</option>
      <option value="cute1">1. きらきら</option>
      <option value="cute2">2. どれみ行進曲</option>
      <option value="cute3">3. ハッピー・ループ</option>
    </select>
  </div>
  <button id="prev" class="btn">← まえ</button>
  <button id="play" class="btn">▶ / ❚❚</button>
  <button id="next" class="btn">つぎ →</button>
  <div class="range">BGM音量 <input id="bgm" type="range" min="0" max="1" step="0.01" value="0.7"></div>
  <div class="range">テルミン音量 <input id="tvol" type="range" min="0" max="1" step="0.01" value="0.25"></div>
  <div class="range">かず <input id="count" type="range" min="5" max="60" step="1" value="26"></div>
  <div class="range">せんの太さ <input id="thick" type="range" min="2" max="16" step="1" value="7"></div>
  <div class="range">ひかり <input id="glow" type="range" min="10" max="70" step="1" value="32"></div>
  <div class="range">ビート反応<input id="beatAmt" type="range" min="0" max="0.5" step="0.01" value="0.22"></div>
</div>

<script>
(function(){
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d',{alpha:false});
  var controls=document.getElementById('controls');
  var closePanel=document.getElementById('closePanel');
  var countUI=document.getElementById('count'), thickUI=document.getElementById('thick'), glowUI=document.getElementById('glow');
  var tvolUI=document.getElementById('tvol');
  var beatAmt=document.getElementById('beatAmt');
  var bgmUI=document.getElementById('bgm');
  var presetSel=document.getElementById('preset');
  var starter=document.getElementById('starter');
  var startbtn=document.getElementById('startbtn');
  var themeBtn=document.getElementById('theme');

  // テーマ切替
  themeBtn.addEventListener('click', function(){
    document.documentElement.classList.toggle('dark');
    themeBtn.textContent = document.documentElement.classList.contains('dark') ? '🌙 暗くする' : '☀ 明るさ';
  });

  // ===== canvas sizing =====
  var dprCap=1.5;
  function fitNow(){
    var dpr=Math.min(window.devicePixelRatio||1,dprCap);
    var vw=(window.visualViewport&&visualViewport.width?visualViewport.width:innerWidth);
    var vh=(window.visualViewport&&visualViewport.height?visualViewport.height:innerHeight);
    var w=Math.floor(vw*dpr), h=Math.floor(vh*dpr);
    if(w>0 && h>0){ cv.width=Math.max(360,w); cv.height=Math.max(360,h); return true; }
    return false;
  }
  function fitEnsure(){ if(!fitNow()){ var id=setInterval(function(){ if(fitNow()){ clearInterval(id); if(shapes.length===0) reset(); } }, 50); } else { if(shapes.length===0) reset(); } }
  fitEnsure();
  addEventListener('resize',fitEnsure,{passive:true});
  addEventListener('orientationchange',fitEnsure,{passive:true});
  if(window.visualViewport){ visualViewport.addEventListener('resize',fitEnsure,{passive:true}); }

  // ===== panel toggle =====
  var activePointers=new Map(); var holdTimer=null;
  function togglePanel(){ controls.classList.toggle('hidden'); }
  function clearPointers(){ activePointers.clear(); if(holdTimer){clearTimeout(holdTimer); holdTimer=null;} }
  function onPointerDownForMenu(e){ activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(activePointers.size>=2&&!holdTimer){ holdTimer=setTimeout(togglePanel,1000);} }
  function onPointerMoveForMenu(e){ var p=activePointers.get(e.pointerId); if(!p) return; if(Math.abs(e.clientX-p.x)>20||Math.abs(e.clientY-p.y)>20) clearPointers(); }
  function onPointerUpForMenu(){ clearPointers(); }
  cv.addEventListener('pointerdown',onPointerDownForMenu,{passive:false});
  cv.addEventListener('pointermove',onPointerMoveForMenu,{passive:false});
  cv.addEventListener('pointerup',onPointerUpForMenu,{passive:false});
  cv.addEventListener('pointercancel',onPointerUpForMenu,{passive:false});
  var taps=0,tapTimer=null; cv.addEventListener('pointerdown',function(){ taps++; if(taps===1){ tapTimer=setTimeout(function(){taps=0},1200);} if(taps>=3){ clearTimeout(tapTimer); taps=0; togglePanel(); }});
  closePanel.addEventListener('click', function(){ controls.classList.add('hidden'); });

  // ===== audio =====
  var audList=[], audIdx=0, audio=new Audio(); audio.preload="auto";
  var actx=null, analyser=null, thFilter=null, thAmp=null, oscA=null, oscB=null, lfoTrem=null, lfoTremGain=null, lfoVib=null, lfoVibGain=null;
  var envGain=null;
  var pluckOsc=null, pluckFilter=null;
  var bgmBus=null;

  function ensureAudio(){
    if(actx) return;
    var AC=window.AudioContext||window.webkitAudioContext; actx=new AC();
    bgmBus=actx.createGain(); bgmBus.gain.value=parseFloat(bgmUI.value);
    analyser=actx.createAnalyser(); analyser.fftSize=256;

    // Theremin（固定・最小）
    thFilter=actx.createBiquadFilter(); thFilter.type='lowpass'; thFilter.frequency.value=1800;
    envGain=actx.createGain(); envGain.gain.value=0.0;
    thAmp=actx.createGain(); thAmp.gain.value=parseFloat(tvolUI.value);
    oscA=actx.createOscillator(); oscA.type='sine';
    oscB=actx.createOscillator(); oscB.type='sine';
    lfoTrem=actx.createOscillator(); lfoTrem.type='sine'; lfoTrem.frequency.value=0.7;
    lfoTremGain=actx.createGain(); lfoTremGain.gain.value=0.1;
    lfoVib=actx.createOscillator(); lfoVib.type='sine'; lfoVib.frequency.value=5.0;
    lfoVibGain=actx.createGain(); lfoVibGain.gain.value=3.5;

    oscA.connect(thFilter); oscB.connect(thFilter);
    thFilter.connect(envGain).connect(thAmp).connect(analyser).connect(actx.destination);
    lfoVib.connect(lfoVibGain); lfoVibGain.connect(oscA.detune); lfoVibGain.connect(oscB.detune);
    lfoTrem.connect(lfoTremGain).connect(thAmp.gain);

    var src=actx.createMediaElementSource(audio);
    src.connect(bgmBus);
    bgmBus.connect(analyser).connect(actx.destination);

    oscA.start(); oscB.start(); lfoTrem.start(); lfoVib.start();
    updateBgmVol();
  }

  function startAudioFlow(){
    ensureAudio();
    try{ if(actx && actx.state!=='running') actx.resume(); }catch(_){}
    if(starter && starter.parentNode){ starter.parentNode.removeChild(starter); }
  }

  startbtn.addEventListener('click', startAudioFlow);

  function updateBgmVol(){ if(bgmBus&&actx) bgmBus.gain.setTargetAtTime(parseFloat(bgmUI.value),actx.currentTime,0.05); }
  bgmUI.addEventListener('input', function(){ ensureAudio(); updateBgmVol(); });
  tvolUI.addEventListener('input', function(){ ensureAudio(); thAmp && thAmp.gain.setTargetAtTime(parseFloat(tvolUI.value), actx.currentTime, 0.05); });

  // プリセット
  var presetPlaying=false, seqTimer=null, seqPos=0, seqData=null, seqTempo=100;
  function stopPreset(){ presetPlaying=false; if(seqTimer){ clearTimeout(seqTimer); seqTimer=null; } seqPos=0; }
  function startPreset(kind){
    ensureAudio();
    stopPreset();
    var synth = (note,dur)=>{
      var t=actx.currentTime;
      var o=actx.createOscillator(); o.type='triangle';
      var g=actx.createGain(); g.gain.value=0.0;
      var f=440*Math.pow(2,(note-69)/12);
      var lpf=actx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=2200;
      o.frequency.value=f;
      o.connect(lpf).connect(g).connect(bgmBus);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.8,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.95);
      o.start(t); o.stop(t+dur);
    };

    if(kind==='cute1'){ seqTempo=96; seqData=[60,60,67,67,69,69,67,null, 65,65,64,64,62,62,60,null]; }
    else if(kind==='cute2'){ seqTempo=112; seqData=[60,62,64,65,67,67,67,null, 67,69,71,72,71,69,67,null]; }
    else if(kind==='cute3'){ seqTempo=108; seqData=[60,64,67,72,null, 67,71,74,79,null, 69,72,76,81,null, 65,69,72,77,null]; }
    else{ seqData=null; }

    if(!seqData) return;
    presetPlaying=true;
    (function tick(){
      if(!presetPlaying) return;
      var stepDur = 60/seqTempo;
      var n = seqData[seqPos % seqData.length];
      if(n!=null){
        var t=actx.currentTime;
        var o=actx.createOscillator(); o.type='triangle';
        var g=actx.createGain(); g.gain.value=0.0;
        var f=440*Math.pow(2,(n-69)/12);
        var lpf=actx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=2200;
        o.frequency.value=f;
        o.connect(lpf).connect(g).connect(bgmBus);
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.8,t+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001,t+stepDur*0.95);
        o.start(t); o.stop(t+stepDur);
      }
      seqPos++;
      seqTimer = setTimeout(tick, stepDur*1000);
    })();
  }
  presetSel.addEventListener('change', function(){
    stopPreset();
    if(presetSel.value==='none'){ return; }
    try{ audio.pause(); }catch(_){}
    startAudioFlow();
    startPreset(presetSel.value);
  });

  // フォルダBGM
  function naturalSort(a,b){ return a.name.localeCompare(b.name,'ja',{numeric:true}); }
  document.getElementById('audDir').addEventListener('change', function(e){
    startAudioFlow();
    audList = Array.prototype.slice.call(e.target.files).filter(function(f){return f.type.indexOf('audio/')===0;}).sort(naturalSort);
    audIdx=0; if(audList.length){ presetSel.value='none'; stopPreset(); playIndex(audIdx); }
  });
  function playIndex(i){ if(!audList.length) return; presetSel.value='none'; stopPreset(); audio.src=URL.createObjectURL(audList[i]); ensureAudio(); try{ if(actx && actx.state!=='running') actx.resume(); audio.play(); }catch(_){ } }
  document.getElementById('next').addEventListener('click',function(){
    if(presetSel.value!=='none'){ seqPos=0; return; }
    if(!audList.length)return; audIdx=(audIdx+1)%audList.length; playIndex(audIdx);
  });
  document.getElementById('prev').addEventListener('click',function(){
    if(presetSel.value!=='none'){ seqPos=0; return; }
    if(!audList.length)return; audIdx=(audIdx-1+audList.length)%audList.length; playIndex(audIdx);
  });
  document.getElementById('play').addEventListener('click',function(){
    startAudioFlow();
    if(presetSel.value!=='none'){
      if(presetPlaying){ stopPreset(); } else { startPreset(presetSel.value); }
      return;
    }
    if(actx && actx.state!=='running') try{actx.resume();}catch(_){ }
    if(audio.paused){ try{audio.play();}catch(_){ } } else { audio.pause(); }
  });
  audio.addEventListener('ended', function(){ if(audList.length){ audIdx=(audIdx+1)%audList.length; playIndex(audIdx); } else { audio.currentTime=0; audio.play(); } });

  // ===== interaction =====
  var pressStart=0, dragging=false;
  var lastPos={x:null,y:null};
  var chime=new Audio("./Chime.mp3"); chime.volume=0.3;

  cv.addEventListener('pointerdown', function(e){
    startAudioFlow();
    pressStart=Date.now();
    dragging=true;
    updateLastPos(e);
  });
  cv.addEventListener('pointermove', function(e){
    if(!dragging) return;
    updateLastPos(e);
    if(Date.now()-pressStart>180){
      onThereminDrag(e);
      gateOn();
    }
  });
  function onThereminDrag(e){
    var p=getCanvasPos(e); if(!p) return;
    var beta=(p.y/cv.height - 0.5)*360;
    setPitchFromBeta(beta);
  }
  function updateLastPos(e){
    var p=getCanvasPos(e);
    if(p){ lastPos=p; }
  }
  function getCanvasPos(e){
    var rect=cv.getBoundingClientRect();
    var x=(e.clientX-rect.left)/rect.width*cv.width;
    var y=(e.clientY-rect.top)/rect.height*cv.height;
    if(isFinite(x)&&isFinite(y)) return {x:x,y:y};
    return null;
  }

  window.addEventListener('pointerup', function(e){
    if(!dragging) return;
    dragging=false;
    var dur=Date.now()-pressStart;
    if(dur<=180){
      doPluck();
      try{ chime.currentTime=0; chime.play(); }catch(_){}
      doBurst(e);
    }else{
      gateOff();
    }
  });
  cv.addEventListener('pointercancel', function(){ dragging=false; gateOff(); });

  function doPluck(){
    if(!actx) return;
    var now=actx.currentTime;
    pluckOsc=actx.createOscillator(); pluckOsc.type='triangle';
    var g=actx.createGain(); g.gain.value=0.0;
    pluckFilter=actx.createBiquadFilter(); pluckFilter.type='lowpass'; pluckFilter.frequency.value=2400;
    pluckOsc.connect(pluckFilter).connect(g).connect(actx.destination);
    var f=window.pitchHz||440; pluckOsc.frequency.value=f;
    g.gain.setValueAtTime(0,now);
    g.gain.linearRampToValueAtTime(0.9, now+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now+0.35);
    pluckOsc.start(now); pluckOsc.stop(now+0.5);
  }

  function gateOn(){ if(!actx||!envGain) return; var t=actx.currentTime; envGain.gain.cancelScheduledValues(t); envGain.gain.setTargetAtTime(1.0,t,0.06); }
  function gateOff(){ if(!actx||!envGain) return; var t=actx.currentTime; envGain.gain.cancelScheduledValues(t); envGain.gain.setTargetAtTime(0.0,t,0.12); }

  // Pitch mapping（固定120〜900Hz）
  function setPitchFromBeta(beta){
    var pmin=120, pmax=900;
    var n=Math.min(1,Math.max(0,(beta+180)/360));
    var curve=Math.sin(n*Math.PI);
    window.pitchHz = pmin + curve*(pmax-pmin);
    if(actx&&oscA&&oscB){
      var t=actx.currentTime;
      oscA.frequency.setTargetAtTime(window.pitchHz,t,0.02);
      oscB.frequency.setTargetAtTime(window.pitchHz,t,0.02);
    }
    if(actx&&thFilter){
      thFilter.frequency.setTargetAtTime(1400 + curve*1200, actx.currentTime, 0.06);
    }
  }

  // draw loop（明るい配色と強めの輪郭）
  var t=0, visScale=1, beatBoost=0;
  var lineBase, glow;
  var COLORS=["#2563eb","#ef4444","#f59e0b","#10b981","#8b5cf6"], TYPES=["circle","triangle","square","star","heart"], shapes=[];
  function starPath(r,s){ var p=new Path2D(), st=Math.PI/s; p.moveTo(r,0); for(var i=0;i<s*2;i++){ var rr=(i%2===0)?r:r*0.45; var a=i*st; p.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);} p.closePath(); return p; }
  function heartPath(r){ var p=new Path2D(); p.moveTo(0,-r*0.2); p.bezierCurveTo(r*0.9,-r*0.9, r*1.4,r*0.5, 0,r*1.2); p.bezierCurveTo(-r*1.4,r*0.5, -r*0.9,-r*0.9, 0,-r*0.2); return p; }
  var starCache=new Map(), heartCache=new Map(); function getStar(r){ var k=r|0; if(!starCache.has(k)) starCache.set(k,starPath(k,5)); return starCache.get(k);} function getHeart(r){ var k=r|0; if(!heartCache.has(k)) heartCache.set(k,heartPath(k)); return heartCache.get(k); }
  function reset(){ shapes.length=0; var n=Math.max(5,(countUI.value|0)); for(var i=0;i<n;i++){ var type=TYPES[i%TYPES.length], r=70*(0.6+Math.random()*0.6), x=Math.random()*cv.width, y=Math.random()*cv.height, rot=Math.random()*Math.PI*2, vx=(Math.random()-0.5)*0.5, vy=(Math.random()-0.5)*0.5, color=COLORS[i%COLORS.length]; shapes.push({type:type,x:x,y:y,r:r,rot:rot,vx:vx,vy:vy,pulse:0,color:color,flash:0}); } }
  reset();
  document.getElementById('count').addEventListener('input', reset);

  function doBurst(e){
    var p=getCanvasPos(e) || lastPos;
    if(!p) return;
    var px=p.x, py=p.y;
    for(var i=0;i<shapes.length;i++){
      var s=shapes[i];
      var ang=Math.atan2(s.y-py, s.x-px);
      var f=4.5 + Math.random()*3.0;
      s.vx += Math.cos(ang)*f; s.vy += Math.sin(ang)*f;
      s.pulse = Math.min(1.5, s.pulse+1.2);
      s.flash = 1.0;
    }
  }

  function draw(){
    var w=cv.width,h=cv.height;
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#ffffff';
    ctx.fillRect(0,0,w,h);
    lineBase=parseFloat(thickUI.value);
    glow=parseFloat(glowUI.value);
    var pmin=120, pmax=900;
    var pnorm=Math.min(1, Math.max(0, (window.pitchHz - pmin) / Math.max(1,(pmax-pmin)) ));
    var add=0;
    if(analyser){
      var data=new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      var sum=0; for(var i=0;i<data.length;i++){ var v=data[i]/255; sum+=v*v; }
      var rms=Math.sqrt(sum/data.length);
      beatBoost += (rms - beatBoost)*0.08;
      add = beatBoost * parseFloat(beatAmt.value);
    }
    var targetScale = (0.5 + 1.1*pnorm) + add;
    visScale += (targetScale - visScale) * 0.15;

    for(var i=0;i<shapes.length;i++){
      var s=shapes[i];
      s.x+=s.vx; s.y+=s.vy; s.rot+=0.008;
      if(s.x<s.r){s.x=s.r; s.vx=Math.abs(s.vx);} if(s.x>w-s.r){s.x=w-s.r; s.vx=-Math.abs(s.vx);}
      if(s.y<s.r){s.y=s.r; s.vy=Math.abs(s.vy);} if(s.y>h-s.r){s.y=h-s.r; s.vy=-Math.abs(s.vy);}
      s.vx*=0.992; s.vy*=0.992;
      var base=1+0.07*Math.sin(t*0.03+s.x*0.003)+s.pulse*0.25;
      var rr=s.r*base*visScale; s.pulse*=0.92;
      ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.rot);
      ctx.lineJoin="round"; ctx.lineCap="round";
      ctx.shadowColor=s.color; ctx.shadowBlur=glow*2; ctx.strokeStyle=s.color; ctx.lineWidth=lineBase*2.6; drawShape(s.type,rr);
