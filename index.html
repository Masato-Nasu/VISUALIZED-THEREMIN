<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KB × AERIAL Merge</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b0c10">
  <style>
    :root{ --bg:#0b0c10; --fg:#e8e8f0; }
    html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg); touch-action:manipulation; }
    #kbFrame{ position:fixed; inset:0; width:100%; height:100%; border:0; }
    #panel{ position:fixed; right:16px; bottom:16px; width:min(520px,96vw); height:min(70vh,560px);
            background:#000; border:1px solid #2a2a33; border-radius:14px; overflow:hidden;
            box-shadow:0 16px 48px rgba(0,0,0,.5); display:none; z-index:10; }
    #drag{ position:absolute; inset:0 0 auto 0; height:24px; background:#111114; color:#9aa0a6; font:12px/24px ui-sans-serif; padding-left:10px; cursor:move; z-index:11; }
    #aerialFrame{ position:absolute; inset:24px 0 0 0; width:100%; height:calc(100% - 24px); border:0; background:#0b0d11; }
    #hint{ position:fixed; right:10px; bottom:10px; font:600 12px ui-sans-serif; color:#cfd3ff; opacity:.9; background:#111114cc; padding:6px 8px; border-radius:10px; border:1px solid #2a2a33; z-index:20; }
  </style>
</head>
<body>
  <iframe id="kbFrame" src="./kb_patched.html" allow="autoplay; fullscreen"></iframe>
  <div id="panel">
    <div id="drag">AERIAL 操作パネル（二本指/長押しで表示切替・ドラッグで移動・Sキーでも可）</div>
    <iframe id="aerialFrame" src="./aerial/index.html" allow="autoplay; microphone; fullscreen; clipboard-read; clipboard-write"></iframe>
  </div>
  <div id="hint">✌ 二本指タッチ／長押し（0.8秒）／Sキー でパネル表示</div>

  <script>

    if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js"); }
    const panel = document.getElementById('panel');
    const hint = document.getElementById('hint');
    const kbFrame = document.getElementById('kbFrame');
    const aerialFrame = document.getElementById('aerialFrame');

    function setPanel(show){ panel.style.display = show ? "block" : "none"; hint.style.opacity = show ? 0.6 : 0.9; }
    function toggle(){ setPanel(panel.style.display!=="block"); }

    // Initial: show once then hide
    (function init(){
      setPanel(true);
      setTimeout(()=>setPanel(false), 4000);
    })();

    // Two-finger on wrapper
    let lastTF=0;
    document.addEventListener('touchstart', e=>{
      const now=performance.now();
      if(e.touches && e.touches.length>=2 && now-lastTF>500){ lastTF=now; toggle(); }
    }, {passive:true});

    // KB notifies parent for 2-finger as well
    window.addEventListener("message", (e)=>{
      if(e && e.data && e.data.type==="KB_TWO_FINGER"){ toggle(); }
      if(e && e.data && e.data.type==="AERIAL_LEVEL" && typeof e.data.vol==="number"){
        latestVol = Math.max(0, Math.min(1, e.data.vol));
        latestVolTime = performance.now();
      }
    });

    // STRICT coupling: only accept level from AERIAL bridge. No deviceorientation/pointer fallback.
    let latestVol = 0.0, latestVolTime = 0;
    let envVol = 0.0; // envelope follower (attack/slow release)
    const ATTACK = 0.35; // faster rise
    const RELEASE = 0.06; // slow fall

    // Remove any CSS transitions that could appear as wobble
    kbFrame.style.transition = "none";
    kbFrame.style.transformOrigin = "50% 50%";

    function loop(){
      requestAnimationFrame(loop);
      // Envelope follow
      const target = latestVol;
      const coeff = (target > envVol) ? ATTACK : RELEASE;
      envVol = envVol + (target - envVol) * coeff;

      const scale = 1 + 0.14 * envVol; // scale only
      kbFrame.style.transform = `scale(${scale})`;

      // Request current level from AERIAL periodically
      if(aerialFrame && aerialFrame.contentWindow){
        aerialFrame.contentWindow.postMessage({type:"REQ_LEVEL"}, "*");
      }
    }
    loop();

    // Inject bridge into AERIAL to estimate volume (UIは変更しない)
    aerialFrame.addEventListener("load", ()=>{
      try{
        const doc = aerialFrame.contentDocument;
        const s = doc.createElement("script");
        s.type = "text/javascript";
        s.text = `
          (function(){
            // Orientation-based estimate as a proxy for master level (no UI変更)
            let vol01 = 0;
            function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
            function onOrient(e){
              const gr = (e.gamma||0)*Math.PI/180;
              vol01 = (Math.sin(gr)+1)/2;
            }
            window.addEventListener("deviceorientation", onOrient, {passive:true});
            window.addEventListener("message", (e)=>{
              if(e && e.data && e.data.type==="REQ_LEVEL"){
                try{ parent.postMessage({type:"AERIAL_LEVEL", vol: vol01}, "*"); }catch{}
              }
            });
          })();
        `;
        doc.head.appendChild(s);
      }catch(e){ /* same-origin assumed; ignore if not */ }
    });

    // One-finger long-press & 'S' key: aux toggles
    (function(){
      let timer=null;
      document.addEventListener('touchstart', e=>{
        if(e.touches && e.touches.length===1){
          timer=setTimeout(()=>toggle(), 800);
        }
      }, {passive:true});
      function cancel(){ if(timer){ clearTimeout(timer); timer=null; } }
      document.addEventListener('touchend', cancel);
      document.addEventListener('touchmove', cancel);
    })();
    document.addEventListener('keydown', e=>{ if(e.key==='s'||e.key==='S'){ toggle(); } });

    // Drag panel
    (function(){
      const drag=document.getElementById('drag');
      let sx=0, sy=0, ox=0, oy=0, on=false;
      drag.addEventListener('pointerdown', (e)=>{
        on=true; drag.setPointerCapture(e.pointerId);
        const r=panel.getBoundingClientRect(); ox=r.left; oy=r.top; sx=e.clientX; sy=e.clientY;
        document.body.style.cursor='grabbing';
      });
      drag.addEventListener('pointermove', (e)=>{
        if(!on) return;
        const dx=e.clientX-sx, dy=e.clientY-sy;
        panel.style.left=Math.max(8, Math.min(window.innerWidth-panel.offsetWidth-8, ox+dx))+"px";
        panel.style.top=Math.max(8, Math.min(window.innerHeight-panel.offsetHeight-8, oy+dy))+"px";
        panel.style.right="auto"; panel.style.bottom="auto";
      });
      const end=()=>{ on=false; document.body.style.cursor=''; };
      drag.addEventListener('pointerup', end); drag.addEventListener('pointercancel', end);
    })();

</script>
</body>
</html>
