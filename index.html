<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KB × AERIAL Merge</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b0c10">
  <style>
    :root{ --bg:#0b0c10; --fg:#e8e8f0; }
    html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg); touch-action:manipulation; }
    #kbFrame{ position:fixed; inset:0; width:100%; height:100%; border:0; }
    #panel{ position:fixed; right:16px; bottom:16px; width:min(520px,96vw); height:min(70vh,560px);
            background:#000; border:1px solid #2a2a33; border-radius:14px; overflow:hidden;
            box-shadow:0 16px 48px rgba(0,0,0,.5); display:none; z-index:10; }
    #drag{ position:absolute; inset:0 0 auto 0; height:24px; background:#111114; color:#9aa0a6; font:12px/24px ui-sans-serif; padding-left:10px; cursor:move; z-index:11; }
    #aerialFrame{ position:absolute; inset:24px 0 0 0; width:100%; height:calc(100% - 24px); border:0; background:#0b0d11; }
    #hint{ position:fixed; right:10px; bottom:10px; font:600 12px ui-sans-serif; color:#cfd3ff; opacity:.9; background:#111114cc; padding:6px 8px; border-radius:10px; border:1px solid #2a2a33; z-index:20; }
  </style>
</head>
<body>
  <iframe id="kbFrame" allow="fullscreen" src="./kb_patched.html?v=15" allow="autoplay; fullscreen"></iframe>
  <div id="panel">
    <div id="drag">AERIAL 操作パネル（二本指/長押しで表示切替・ドラッグで移動・Sキーでも可）</div>
    <iframe id="aerialFrame" allow="autoplay; microphone; fullscreen" src="./aerial/index.html?v=15" allow="autoplay; microphone; fullscreen; clipboard-read; clipboard-write"></iframe>
  </div>
  <div id="hint">✌ 二本指タッチ／長押し（0.8秒）／Sキー でパネル表示</div>

  <script>

    if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js"); }

    const panel = document.getElementById('panel');
    const hint = document.getElementById('hint');
    const kbFrame = document.getElementById('kbFrame');
    const aerialFrame = document.getElementById('aerialFrame');

    function setPanel(show){ panel.style.display = show ? "block" : "none"; hint.style.opacity = show ? 0.6 : 0.9; }
    function toggle(force){ if(typeof force==="boolean"){ setPanel(force); } else { setPanel(panel.style.display!=="block"); } }

    // Show briefly on load
    (function(){ setPanel(true); setTimeout(()=>setPanel(false), 2400); })();

    // Parent-level long-press & S
    (function(){
      let t=null;
      document.addEventListener('touchstart', e=>{ if(e.touches?.length===1){ t=setTimeout(()=>toggle(), 800); } }, {passive:true});
      const cancel=()=>{ if(t){ clearTimeout(t); t=null; } };
      document.addEventListener('touchend', cancel);
      document.addEventListener('touchmove', cancel);
    })();
    document.addEventListener('keydown', e=>{ if(e.key==='s'||e.key==='S'){ toggle(); } });

    // Visible toggles
    (function(){
      const gear=document.createElement('button');
      gear.textContent="⚙"; Object.assign(gear.style,{position:"fixed",left:"6px",top:"6px",width:"24px",height:"24px",borderRadius:"6px",border:"1px solid #2a2a33",background:"#111114cc",color:"#cfd3ff",font:"600 12px ui-sans-serif",zIndex:30,opacity:.6});
      gear.addEventListener('click', ()=>toggle(true)); document.body.appendChild(gear);
      const br=document.createElement('div');
      Object.assign(br.style,{position:"fixed",right:"8px",bottom:"8px",width:"48px",height:"48px",zIndex:29,background:"transparent"});
      let lastTap=0; br.addEventListener('touchstart', e=>{ const now=performance.now(); if(now-lastTap<350){ toggle(true); } lastTap=now; }, {passive:true});
      document.body.appendChild(br);
    })();

    // Envelope scaling using ONLY true level from AERIAL
    let env=0; const ATTACK=0.8, RELEASE=0.25;
    kbFrame.style.transition="none"; kbFrame.style.transformOrigin="50% 50%";
    window.addEventListener("message", (e)=>{
      if(e?.data?.type==="AERIAL_LEVEL_TRUE" && typeof e.data.vol==="number"){
        const target = Math.max(0, Math.min(1, e.data.vol));
        const coeff = (target>=env) ? ATTACK : RELEASE;
        env = env + (target - env) * coeff;
        const scale = 1 + 0.24*env;
        kbFrame.style.transform = `scale(${scale})`;
      }
      // Two-finger relays from iframes
      if(e?.data?.type==="KB_TWO_FINGER"){ toggle(); }
      if(e?.data?.type==="AERIAL_TWO_FINGER"){ toggle(); }
    });

    // Inject bridge into AERIAL at runtime (true level via analyser tee)
    aerialFrame.addEventListener("load", ()=>{
      try{
        const d=aerialFrame.contentDocument;
        const s=d.createElement("script");
        s.type="text/javascript";
        s.text = `
          (function(){
            // Two-finger detector -> parent
            (function(){
              let last=0;
              function on2(e){
                if(e.touches && e.touches.length>=2){
                  const now=performance.now();
                  if(now-last>400){ last=now; try{ parent.postMessage({type:"AERIAL_TWO_FINGER"}, "*"); }catch{} }
                  e.preventDefault(); e.stopImmediatePropagation(); return false;
                }
              }
              ['touchstart','touchmove','touchend','gesturestart'].forEach(tp=>{
                document.addEventListener(tp, on2, {capture:true, passive:false});
              });
            })();

            // True audio level bridge
            let analyser=null, hooked=false;
            function startPosting(ctx, node){
              if(hooked) return;
              hooked=true;
              analyser = ctx.createAnalyser(); analyser.fftSize = 512;
              const capture = new Float32Array(analyser.fftSize);
              const tee = ctx.createGain(); tee.gain.value = 1.0;
              try{ node.disconnect(); }catch{}
              node.connect(tee); tee.connect(ctx.destination); tee.connect(analyser);
              setInterval(()=>{
                analyser.getFloatTimeDomainData(capture);
                let sum=0; for(let i=0;i<capture.length;i++){ const v=capture[i]; sum+=v*v; }
                const rms = Math.sqrt(sum/capture.length);
                const level = Math.max(0, Math.min(1, rms*3.0));
                try{ parent.postMessage({type:"AERIAL_LEVEL_TRUE", vol: level}, "*"); }catch{}
              }, 50);
            }
            function tryHook(){
              const cands=[window.masterGain, window.master, window.MainGain, window.master_out, window.gMaster];
              for(const g of cands){
                try{ if(g && g.context && g.gain){ startPosting(g.context, g); return true; } }catch{}
              }
              return false;
            }
            if(!tryHook()){
              const _connect=AudioNode.prototype.connect;
              AudioNode.prototype.connect=function(){
                try{
                  const ctx=this.context;
                  for(let i=0;i<arguments.length;i++){
                    if(arguments[i] && arguments[i]===ctx.destination && !hooked){
                      const tee = ctx.createGain(); tee.gain.value=1.0;
                      _connect.call(this, tee);
                      _connect.call(tee, ctx.destination);
                      analyser = ctx.createAnalyser(); analyser.fftSize = 512;
                      const capture=new Float32Array(analyser.fftSize);
                      _connect.call(tee, analyser);
                      hooked=true;
                      setInterval(()=>{
                        analyser.getFloatTimeDomainData(capture);
                        let sum=0; for(let j=0;j<capture.length;j++){ const v=capture[j]; sum+=v*v; }
                        const rms=Math.sqrt(sum/capture.length);
                        const level=Math.max(0, Math.min(1, rms*3.0));
                        try{ parent.postMessage({type:"AERIAL_LEVEL_TRUE", vol: level}, "*"); }catch{}
                      }, 50);
                      return;
                    }
                  }
                }catch{}
                return _connect.apply(this, arguments);
              };
            }
          })();
        `;
        d.head.appendChild(s);
      }catch{}
    });

    // Inject two-finger detector into KB as well
    kbFrame.addEventListener("load", ()=>{
      try{
        const d=kbFrame.contentDocument;
        const s=d.createElement("script");
        s.type="text/javascript";
        s.text = `
          (function(){
            let last=0;
            function on2(e){
              if(e.touches && e.touches.length>=2){
                const now=performance.now();
                if(now-last>400){ last=now; try{ parent.postMessage({type:"KB_TWO_FINGER"}, "*"); }catch{} }
                e.preventDefault(); e.stopImmediatePropagation(); return false;
              }
            }
            ['touchstart','touchmove','touchend','gesturestart'].forEach(tp=>{
              document.addEventListener(tp, on2, {capture:true, passive:false});
            });
          })();
        `;
        d.head.appendChild(s);
      }catch{}
    });

</script>
</body>
</html>
