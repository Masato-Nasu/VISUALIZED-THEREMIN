<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Baby Theremin Shapes — v1.6.2</title>
<link rel="manifest" href="./manifest.json?v=1.6.2">
<meta name="theme-color" content="#1a1a1a">
<style>
  :root{ --bg:#1a1a1a; --panel:#20232bcc; --text:#E8EAF2; --muted:#8b90a1; }
  html,body{ height:100%; margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Roboto,"Noto Sans JP",sans-serif; overscroll-behavior:none; }
  #cv{ position:fixed; inset:0; width:100vw; height:100svh; display:block; touch-action:none; background:var(--bg); }
  .controls{ position:fixed; left:0; right:0; bottom:0; padding:12px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center;
    background:var(--panel); backdrop-filter:saturate(1.05) blur(6px); border-top-left-radius:16px; border-top-right-radius:16px;
    transition:opacity .2s ease, visibility .2s ease, transform .2s ease; transform:translateY(8px) }
  .controls *{ touch-action:manipulation }
  .controls.hidden{ opacity:0; visibility:hidden; pointer-events:none; transform:translateY(12px) }
  .btn{appearance:none;border:0;border-radius:14px;background:#2f6feb;color:#fff; padding:12px 16px;font-size:16px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .range{display:inline-flex;align-items:center;gap:10px;background:#0f1117; color:#E8EAF2; border-radius:14px;padding:10px 12px; box-shadow:0 2px 8px rgba(0,0,0,.25)}
  input[type="range"]{width:160px}
  .hint{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#00000066;border:1px solid #ffffff1a;color:#fff;
        padding:8px 12px;border-radius:10px;font-size:14px}
  .closer{position:absolute;right:8px;top:-36px;background:#00000080;border:1px solid #ffffff22;color:#fff;padding:6px 10px;border-radius:10px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hint" id="hint">👶 軽タップ＝ポン（はじける）／長押しドラッグ＝テルミン（v1.6.2）</div>
<div class="controls hidden" id="controls">
  <button id="closePanel" class="closer">× とじる</button>
  <label class="btn">🎵 おんがくフォルダ<input id="audDir" type="file" webkitdirectory directory multiple accept="audio/*" hidden></label>
  <button id="prev" class="btn">← まえ</button>
  <button id="play" class="btn">▶ / ❚❚</button>
  <button id="next" class="btn">つぎ →</button>
  <div class="range">かず <input id="count" type="range" min="3" max="50" step="1" value="22"></div>
  <div class="range">せんの太さ <input id="thick" type="range" min="2" max="14" step="1" value="6"></div>
  <div class="range">ひかり <input id="glow" type="range" min="8" max="60" step="1" value="28"></div>
  <div class="range">ピッチ最小Hz <input id="pmin" type="range" min="80" max="400" step="1" value="120"></div>
  <div class="range">ピッチ最大Hz <input id="pmax" type="range" min="500" max="2000" step="1" value="900"></div>
  <div class="range">テルミン音量 <input id="tvol" type="range" min="0" max="1" step="0.01" value="0.22"></div>
  <div class="range">ゆらぎ（強弱）<input id="trem" type="range" min="0" max="1" step="0.01" value="0.45"></div>
  <div class="range">ゆらぎ速度<input id="tremSpd" type="range" min="0.1" max="3" step="0.01" value="0.7"></div>
  <div class="range">二重 detune<input id="detune" type="range" min="0" max="20" step="0.1" value="7.5"></div>
  <div class="range">ビブラート深さ<input id="vibDepth" type="range" min="0" max="18" step="0.1" value="3.5"></div>
  <div class="range">ビブラート速度<input id="vibRate" type="range" min="0.5" max="8" step="0.01" value="5"></div>
  <div class="range">フィルター明るさ<input id="bright" type="range" min="400" max="5000" step="1" value="1800"></div>
  <div class="range">ビート反応<input id="beatAmt" type="range" min="0" max="0.4" step="0.01" value="0.18"></div>
</div>

<script>
(function(){
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d',{alpha:false});
  var controls=document.getElementById('controls');
  var closePanel=document.getElementById('closePanel');
  var countUI=document.getElementById('count'), thickUI=document.getElementById('thick'), glowUI=document.getElementById('glow');
  var pminUI=document.getElementById('pmin'), pmaxUI=document.getElementById('pmax');
  var tvolUI=document.getElementById('tvol'), tremUI=document.getElementById('trem'), tremSpd=document.getElementById('tremSpd');
  var detuneUI=document.getElementById('detune'), vibDepth=document.getElementById('vibDepth'), vibRate=document.getElementById('vibRate'), bright=document.getElementById('bright');
  var beatAmt=document.getElementById('beatAmt');
  var hint=document.getElementById('hint');

  window.pitchHz=440;

  // ===== canvas sizing (robust) =====
  var dprCap=1.5;
  function fitNow(){
    var dpr=Math.min(window.devicePixelRatio||1,dprCap);
    var vw=(window.visualViewport&&visualViewport.width?visualViewport.width:innerWidth);
    var vh=(window.visualViewport&&visualViewport.height?visualViewport.height:innerHeight);
    var w=Math.floor(vw*dpr), h=Math.floor(vh*dpr);
    if(w>0 && h>0){ cv.width=Math.max(360,w); cv.height=Math.max(360,h); return true; }
    return false;
  }
  function fitEnsure(){ if(!fitNow()){ var id=setInterval(function(){ if(fitNow()){ clearInterval(id); if(shapes.length===0) reset(); } }, 50); } else { if(shapes.length===0) reset(); } }
  fitEnsure();
  addEventListener('resize',fitEnsure,{passive:true});
  addEventListener('orientationchange',fitEnsure,{passive:true});
  if(window.visualViewport){ visualViewport.addEventListener('resize',fitEnsure,{passive:true}); }

  // ===== panel toggle =====
  var activePointers=new Map(); var holdTimer=null;
  function togglePanel(){ controls.classList.toggle('hidden'); }
  function clearPointers(){ activePointers.clear(); if(holdTimer){clearTimeout(holdTimer); holdTimer=null;} }
  function onPointerDownForMenu(e){ activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(activePointers.size>=2&&!holdTimer){ holdTimer=setTimeout(togglePanel,1200);} }
  function onPointerMoveForMenu(e){ var p=activePointers.get(e.pointerId); if(!p) return; if(Math.abs(e.clientX-p.x)>20||Math.abs(e.clientY-p.y)>20) clearPointers(); }
  function onPointerUpForMenu(){ clearPointers(); }
  cv.addEventListener('pointerdown',onPointerDownForMenu,{passive:false});
  cv.addEventListener('pointermove',onPointerMoveForMenu,{passive:false});
  cv.addEventListener('pointerup',onPointerUpForMenu,{passive:false});
  cv.addEventListener('pointercancel',onPointerUpForMenu,{passive:false});
  var taps=0,tapTimer=null; cv.addEventListener('pointerdown',function(){ taps++; if(taps===1){ tapTimer=setTimeout(function(){taps=0},1200);} if(taps>=3){ clearTimeout(tapTimer); taps=0; togglePanel(); }});
  closePanel.addEventListener('click', function(){ controls.classList.add('hidden'); });

  // ===== first touch => fullscreen & audio =====
  cv.addEventListener('pointerdown', function(){
    if(!document.fullscreenElement){ try{ document.documentElement.requestFullscreen(); }catch(_){ } }
    ensureAudio(); try{ if(actx && actx.state!=='running') actx.resume(); }catch(_){}
    if(hint && hint.parentNode) hint.parentNode.removeChild(hint);
  }, {once:true});

  // ===== audio =====
  var audList=[], audIdx=0, audio=new Audio(); audio.preload="auto";
  var actx=null, analyser=null, analyserData=null;
  var thMix=null, thFilter=null, thAmp=null, oscA=null, oscB=null, lfoTrem=null, lfoTremGain=null, lfoVib=null, lfoVibGain=null;
  var envGain=null;
  var pluckOsc=null, pluckFilter=null;

  function ensureAudio(){
    if(actx) return;
    var AC=window.AudioContext||window.webkitAudioContext; actx=new AC();
    var src=actx.createMediaElementSource(audio);
    analyser=actx.createAnalyser(); analyser.fftSize=256; analyserData=new Uint8Array(analyser.frequencyBinCount);

    thMix=actx.createGain();
    thFilter=actx.createBiquadFilter(); thFilter.type='lowpass'; thFilter.frequency.value=parseFloat(bright.value);
    envGain=actx.createGain(); envGain.gain.value=0.0;
    thAmp=actx.createGain(); thAmp.gain.value=parseFloat(tvolUI.value);
    oscA=actx.createOscillator(); oscA.type='sine';
    oscB=actx.createOscillator(); oscB.type='sine';
    lfoTrem=actx.createOscillator(); lfoTrem.type='sine'; lfoTremGain=actx.createGain();
    lfoVib=actx.createOscillator(); lfoVib.type='sine'; lfoVibGain=actx.createGain();

    oscA.connect(thMix); oscB.connect(thMix);
    thMix.connect(thFilter).connect(envGain).connect(thAmp).connect(analyser).connect(actx.destination);
    lfoVib.connect(lfoVibGain); lfoVibGain.connect(oscA.detune); lfoVibGain.connect(oscB.detune);
    lfoTrem.connect(lfoTremGain).connect(thAmp.gain);
    src.connect(analyser);

    oscA.start(); oscB.start(); lfoTrem.start(); lfoVib.start();

    updateDetune(); updateTrem(); updateVibrato(); updateBrightness();
  }

  function updateDetune(){ if(!oscA||!oscB) return; var c=parseFloat(detuneUI.value||"7.5"); oscA.detune.value=-c; oscB.detune.value=c; }
  function updateTrem(){ if(!lfoTrem||!lfoTremGain||!thAmp||!actx) return; var base=parseFloat(tvolUI.value), depth=parseFloat(tremUI.value), sp=parseFloat(tremSpd.value); lfoTrem.frequency.setTargetAtTime(sp,actx.currentTime,0.05); lfoTremGain.gain.setTargetAtTime(base*depth*0.6,actx.currentTime,0.05); thAmp.gain.setTargetAtTime(base,actx.currentTime,0.05); }
  function updateVibrato(){ if(!lfoVib||!lfoVibGain||!actx) return; lfoVib.frequency.setTargetAtTime(parseFloat(vibRate.value),actx.currentTime,0.05); lfoVibGain.gain.setTargetAtTime(parseFloat(vibDepth.value),actx.currentTime,0.05); }
  function updateBrightness(){ if(!thFilter||!actx) return; thFilter.frequency.setTargetAtTime(parseFloat(bright.value),actx.currentTime,0.05); }
  tvolUI.addEventListener('input', function(){ ensureAudio(); updateTrem(); });
  tremUI.addEventListener('input', function(){ ensureAudio(); updateTrem(); });
  tremSpd.addEventListener('input', function(){ ensureAudio(); updateTrem(); });
  detuneUI.addEventListener('input', function(){ ensureAudio(); updateDetune(); });
  vibDepth.addEventListener('input', function(){ ensureAudio(); updateVibrato(); });
  vibRate.addEventListener('input', function(){ ensureAudio(); updateVibrato(); });
  bright.addEventListener('input', function(){ ensureAudio(); updateBrightness(); });

  // BGM
  function naturalSort(a,b){ return a.name.localeCompare(b.name,'ja',{numeric:true}); }
  document.getElementById('audDir').addEventListener('change', function(e){
    ensureAudio();
    audList = Array.prototype.slice.call(e.target.files).filter(function(f){return f.type.indexOf('audio/')===0;}).sort(naturalSort);
    audIdx=0; if(audList.length) playIndex(audIdx);
  });
  function playIndex(i){ if(!audList.length) return; audio.src=URL.createObjectURL(audList[i]); ensureAudio(); try{ if(actx && actx.state!=='running') actx.resume(); audio.play(); }catch(_){ } }
  document.getElementById('next').addEventListener('click',function(){ if(!audList.length)return; audIdx=(audIdx+1)%audList.length; playIndex(audIdx); });
  document.getElementById('prev').addEventListener('click',function(){ if(!audList.length)return; audIdx=(audIdx-1+audList.length)%audList.length; playIndex(audIdx); });
  document.getElementById('play').addEventListener('click',function(){ ensureAudio(); if(actx && actx.state!=='running') try{actx.resume();}catch(_){ } if(audio.paused){ try{audio.play();}catch(_){ } } else { audio.pause(); } });
  audio.addEventListener('ended', function(){ if(audList.length){ audIdx=(audIdx+1)%audList.length; playIndex(audIdx); } else { audio.currentTime=0; audio.play(); } });

  // ===== interaction: short tap vs long press =====
  var pressStart=0, dragging=false;
  var lastPos={x:null,y:null}; // track last known position (canvas coordinates)
  var chime=new Audio("./Chime.mp3"); chime.volume=0.3;

  cv.addEventListener('pointerdown', function(e){
    ensureAudio();
    pressStart=Date.now();
    dragging=true;
    updateLastPos(e);
  });
  cv.addEventListener('pointermove', function(e){
    if(!dragging) return;
    updateLastPos(e);
    if(Date.now()-pressStart>180){ // theremin hold
      onThereminDrag(e);
      gateOn();
    }
  });
  function onThereminDrag(e){
    var p=getCanvasPos(e); if(!p) return;
    var beta=(p.y/cv.height - 0.5)*360;
    setPitchFromBeta(beta);
  }
  function updateLastPos(e){
    var p=getCanvasPos(e);
    if(p){ lastPos=p; }
  }
  function getCanvasPos(e){
    var rect=cv.getBoundingClientRect();
    var x=(e.clientX-rect.left)/rect.width*cv.width;
    var y=(e.clientY-rect.top)/rect.height*cv.height;
    if(isFinite(x)&&isFinite(y)) return {x:x,y:y};
    return null;
  }

  window.addEventListener('pointerup', function(e){
    if(!dragging) return;
    dragging=false;
    var dur=Date.now()-pressStart;
    if(dur<=180){ // short tap => pluck + chime + burst
      doPluck();
      try{ chime.currentTime=0; chime.play(); }catch(_){}
      doBurst(e);
    }else{
      gateOff();
    }
  });
  cv.addEventListener('pointercancel', function(){ dragging=false; gateOff(); });

  // Pluck
  function doPluck(){
    if(!actx) return;
    var now=actx.currentTime;
    pluckOsc=actx.createOscillator(); pluckOsc.type='triangle';
    var g=actx.createGain(); g.gain.value=0.0;
    pluckFilter=actx.createBiquadFilter(); pluckFilter.type='lowpass'; pluckFilter.frequency.value=2400;
    pluckOsc.connect(pluckFilter).connect(g).connect(actx.destination);
    var f=window.pitchHz||440; pluckOsc.frequency.value=f;
    g.gain.setValueAtTime(0,now);
    g.gain.linearRampToValueAtTime(0.9, now+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now+0.35);
    pluckOsc.start(now); pluckOsc.stop(now+0.5);
  }

  // ===== shapes =====
  var COLORS=["#A5F3FC","#FBCFE8","#FDE68A","#C7D2FE","#86EFAC"], TYPES=["circle","triangle","square","star","heart"], shapes=[];
  function starPath(r,s){ var p=new Path2D(), st=Math.PI/s; p.moveTo(r,0); for(var i=0;i<s*2;i++){ var rr=(i%2===0)?r:r*0.45; var a=i*st; p.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);} p.closePath(); return p; }
  function heartPath(r){ var p=new Path2D(); p.moveTo(0,-r*0.2); p.bezierCurveTo(r*0.9,-r*0.9, r*1.4,r*0.5, 0,r*1.2); p.bezierCurveTo(-r*1.4,r*0.5, -r*0.9,-r*0.9, 0,-r*0.2); return p; }
  var starCache=new Map(), heartCache=new Map(); function getStar(r){ var k=r|0; if(!starCache.has(k)) starCache.set(k,starPath(k,5)); return starCache.get(k);} function getHeart(r){ var k=r|0; if(!heartCache.has(k)) heartCache.set(k,heartPath(k)); return heartCache.get(k); }
  function reset(){ shapes.length=0; var n=Math.max(3,(countUI.value|0)); for(var i=0;i<n;i++){ var type=TYPES[i%TYPES.length], r=70*(0.6+Math.random()*0.6), x=Math.random()*cv.width, y=Math.random()*cv.height, rot=Math.random()*Math.PI*2, vx=(Math.random()-0.5)*0.5, vy=(Math.random()-0.5)*0.5, color=COLORS[i%COLORS.length]; shapes.push({type:type,x:x,y:y,r:r,rot:rot,vx:vx,vy:vy,pulse:0,color:color,flash:0}); } }
  document.getElementById('count').addEventListener('input', reset);

  // Burst (stronger + flash)
  function doBurst(e){
    var p=getCanvasPos(e) || lastPos;
    if(!p) return;
    var px=p.x, py=p.y;
    for(var i=0;i<shapes.length;i++){
      var s=shapes[i];
      var ang=Math.atan2(s.y-py, s.x-px);
      var f=4.5 + Math.random()*3.0; // stronger push
      s.vx += Math.cos(ang)*f; s.vy += Math.sin(ang)*f;
      s.pulse = Math.min(1.5, s.pulse+1.2);
      s.flash = 1.0; // white flash overlay
    }
  }

  // Theremin gate
  function gateOn(){ if(!actx||!envGain) return; var t=actx.currentTime; envGain.gain.cancelScheduledValues(t); envGain.gain.setTargetAtTime(1.0,t,0.06); }
  function gateOff(){ if(!actx||!envGain) return; var t=actx.currentTime; envGain.gain.cancelScheduledValues(t); envGain.gain.setTargetAtTime(0.0,t,0.12); }

  // Pitch mapping + filter follow
  function setPitchFromBeta(beta){ var pmin=parseFloat(pminUI.value), pmax=parseFloat(pmaxUI.value); var n=Math.min(1,Math.max(0,(beta+180)/360)); var curve=Math.sin(n*Math.PI); window.pitchHz = pmin + curve*(pmax-pmin); if(actx&&oscA&&oscB){ var t=actx.currentTime; oscA.frequency.setTargetAtTime(window.pitchHz,t,0.02); oscB.frequency.setTargetAtTime(window.pitchHz,t,0.02);} if(actx&&thFilter){ thFilter.frequency.setTargetAtTime(parseFloat(bright.value)*(0.8+0.6*curve),actx.currentTime,0.08);} }

  // Optional sensors
  function ask(){ try{ if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission(); }catch(_){ } }
  document.addEventListener('pointerdown', ask, {once:true});
  window.addEventListener('deviceorientation', function(e){ if(e.beta==null) return; if(dragging && Date.now()-pressStart>180) return; setPitchFromBeta(e.beta); }, {passive:true});

  // draw loop with beat-reactive scale
  var t=0, visScale=1, beatBoost=0;
  var lineBase, glow;
  function draw(){
    var w=cv.width,h=cv.height;
    ctx.fillStyle="#1a1a1a"; ctx.fillRect(0,0,w,h);
    lineBase=parseFloat(thickUI.value);
    glow=parseFloat(glowUI.value);
    var pmin=parseFloat(pminUI.value), pmax=parseFloat(pmaxUI.value);
    var pnorm=Math.min(1, Math.max(0, (window.pitchHz - pmin) / Math.max(1,(pmax-pmin)) ));

    var add=0;
    if(analyser){
      var data=new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      var sum=0; for(var i=0;i<data.length;i++){ var v=data[i]/255; sum+=v*v; }
      var rms=Math.sqrt(sum/data.length);
      beatBoost += (rms - beatBoost)*0.08;
      add = beatBoost * parseFloat(beatAmt.value);
    }
    var targetScale = (0.5 + 1.1*pnorm) + add;
    visScale += (targetScale - visScale) * 0.15;

    for(var i=0;i<shapes.length;i++){
      var s=shapes[i];
      s.x+=s.vx; s.y+=s.vy; s.rot+=0.008;
      if(s.x<s.r){s.x=s.r; s.vx=Math.abs(s.vx);} if(s.x>w-s.r){s.x=w-s.r; s.vx=-Math.abs(s.vx);}
      if(s.y<s.r){s.y=s.r; s.vy=Math.abs(s.vy);} if(s.y>h-s.r){s.y=h-s.r; s.vy=-Math.abs(s.vy);}
      s.vx*=0.992; s.vy*=0.992;
      var base=1+0.07*Math.sin(t*0.03+s.x*0.003)+s.pulse*0.25;
      var rr=s.r*base*visScale; s.pulse*=0.92;
      ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.rot);
      ctx.lineJoin="round"; ctx.lineCap="round";
      // flash overlay (decays quickly)
      var flashAlpha = s.flash; if(flashAlpha>0){ ctx.fillStyle='rgba(255,255,255,'+(0.25*flashAlpha)+')'; if(s.type==='square'){ ctx.fillRect(-rr,-rr,rr*2,rr*2);} else { ctx.beginPath(); if(s.type==='circle'){ ctx.arc(0,0,rr,0,Math.PI*2);} else if(s.type==='triangle'){ var h2=rr*1.1; ctx.moveTo(0,-h2); ctx.lineTo(h2*Math.sin(Math.PI/3),h2*Math.cos(Math.PI/3)); ctx.lineTo(-h2*Math.sin(Math.PI/3),h2*Math.cos(Math.PI/3)); ctx.closePath(); } else if(s.type==='star'){ ctx.stroke(getStar(rr)); } else if(s.type==='heart'){ ctx.stroke(getHeart(rr)); } ctx.fill(); } s.flash*=0.85; }
      ctx.shadowColor=s.color; ctx.shadowBlur=glow*2; ctx.strokeStyle=s.color; ctx.lineWidth=lineBase*2.4; drawShape(s.type,rr);
      ctx.shadowBlur=glow; ctx.lineWidth=lineBase*1.5; drawShape(s.type,rr);
      ctx.shadowBlur=glow*0.3; ctx.strokeStyle="#ffffff"; ctx.lineWidth=Math.max(1,lineBase*0.6); drawShape(s.type,rr);
      ctx.restore();
    }
    t++; requestAnimationFrame(draw);
  }
  function drawShape(type,r){ if(type==="circle"){ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke(); return;} if(type==="triangle"){ctx.beginPath(); var h=r*1.1; ctx.moveTo(0,-h); ctx.lineTo(h*Math.sin(Math.PI/3), h*Math.cos(Math.PI/3)); ctx.lineTo(-h*Math.sin(Math.PI/3), h*Math.cos(Math.PI/3)); ctx.closePath(); ctx.stroke(); return;} if(type==="square"){ ctx.strokeRect(-r,-r,r*2,r*2); return;} if(type==="star"){ ctx.stroke(getStar(r)); return;} if(type==="heart"){ ctx.stroke(getHeart(r)); return;} }
  requestAnimationFrame(draw);

})();</script>
<script>
if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js?v=1.6.2"); }
</script>
</body>
</html>
