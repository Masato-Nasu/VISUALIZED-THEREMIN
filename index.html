<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KB × AERIAL Merge</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b0c10">
  <style>
    :root{ --bg:#0b0c10; --fg:#e8e8f0; }
    html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg); touch-action:manipulation; }
    #kbFrame{ position:fixed; inset:0; width:100%; height:100%; border:0; }
    #panel{ position:fixed; right:16px; bottom:16px; width:min(520px,96vw); height:min(70vh,560px);
            background:#000; border:1px solid #2a2a33; border-radius:14px; overflow:hidden;
            box-shadow:0 16px 48px rgba(0,0,0,.5); display:none; z-index:10; }
    #drag{ position:absolute; inset:0 0 auto 0; height:24px; background:#111114; color:#9aa0a6; font:12px/24px ui-sans-serif; padding-left:10px; cursor:move; z-index:11; }
    #aerialFrame{ position:absolute; inset:24px 0 0 0; width:100%; height:calc(100% - 24px); border:0; background:#0b0d11; }
    #hint{ position:fixed; right:10px; bottom:10px; font:600 12px ui-sans-serif; color:#cfd3ff; opacity:.9; background:#111114cc; padding:6px 8px; border-radius:10px; border:1px solid #2a2a33; z-index:20; }
  </style>
</head>
<body>
  <iframe id="kbFrame" src="./kb_patched.html" allow="autoplay; fullscreen"></iframe>
  <div id="panel">
    <div id="drag">AERIAL 操作パネル（二本指/長押しで表示切替・ドラッグで移動・Sキーでも可）</div>
    <iframe id="aerialFrame" src="./aerial/index.html" allow="autoplay; microphone; fullscreen; clipboard-read; clipboard-write"></iframe>
  </div>
  <div id="hint">✌ 二本指タッチ／長押し（0.8秒）／Sキー でパネル表示</div>

  <script>
    if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js"); }
    const panel = document.getElementById('panel');
    const hint = document.getElementById('hint');

    function qs(name){ const m=new URL(location.href); return m.searchParams.get(name); }
    function hashPanel(){ return /panel=(1|0)/.test(location.hash)? location.hash.match(/panel=(1|0)/)[1] : null; }

    function setPanel(show){
      panel.style.display = show ? "block" : "none";
      hint.style.opacity = show ? 0.6 : 0.9;
    }
    function toggle(){ setPanel(panel.style.display!=="block"); }

    // Initial show/hide policy
    (function init(){
      const q=qs("panel"); const h=hashPanel();
      if(q==="1" || h==="1"){ setPanel(true); return; }
      if(q==="0" || h==="0"){ setPanel(false); return; }
      // First load: show, then auto-hide
      setPanel(true);
      setTimeout(()=>setPanel(false), 6000);
    })();

    // Two-finger toggle with cooldown
    let lastTF=0;
    document.addEventListener('touchstart', e => {
      const now=performance.now();
      if(e.touches && e.touches.length>=2 && now-lastTF>500){
        lastTF=now; toggle();
      }
    }, {passive:true});

    // Long-press (0.8s) one finger
    (function(){
      let t0=0, timer=null;
      document.addEventListener('touchstart', e=>{
        if(e.touches && e.touches.length===1){
          t0=performance.now();
          timer=setTimeout(()=>{ toggle(); }, 800);
        }
      }, {passive:true});
      document.addEventListener('touchend', ()=>{ if(timer){ clearTimeout(timer); timer=null; } });
      document.addEventListener('touchmove', ()=>{ if(timer){ clearTimeout(timer); timer=null; } });
    })();

    // Keyboard toggle (desktop)
    document.addEventListener('keydown', e=>{ if(e.key==='s' || e.key==='S'){ toggle(); } });

    // Drag panel
    (function(){
      const drag=document.getElementById('drag');
      let sx=0, sy=0, ox=0, oy=0, on=false;
      drag.addEventListener('pointerdown', (e)=>{
        on=true; drag.setPointerCapture(e.pointerId);
        const r=panel.getBoundingClientRect(); ox=r.left; oy=r.top; sx=e.clientX; sy=e.clientY;
        document.body.style.cursor='grabbing';
      });
      drag.addEventListener('pointermove', (e)=>{
        if(!on) return;
        const dx=e.clientX-sx, dy=e.clientY-sy;
        panel.style.left=Math.max(8, Math.min(window.innerWidth-panel.offsetWidth-8, ox+dx))+"px";
        panel.style.top=Math.max(8, Math.min(window.innerHeight-panel.offsetHeight-8, oy+dy))+"px";
        panel.style.right="auto"; panel.style.bottom="auto";
      });
      const end=()=>{ on=false; document.body.style.cursor=''; };
      drag.addEventListener('pointerup', end); drag.addEventListener('pointercancel', end);
    })();
  
  // Listen for KB two-finger messages
  window.addEventListener("message", (e)=>{
    if(e && e.data && e.data.type==="KB_TWO_FINGER"){ toggle(); }
  });

  // --- Visual coupling (estimate theremin volume from device orientation / pointer proxy) ---
  let vol01 = 0.0, pitch01 = 0.0;
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function map(v,a1,a2,b1,b2){ const t=(v-a1)/(a2-a1); return b1 + (b2-b1)*t; }

  // Estimation: beta (pitch) via 1-cos smoothing, gamma (roll) via sin -> volume
  function onOrient(e){
    const br = (e.beta||0)*Math.PI/180;
    const gr = (e.gamma||0)*Math.PI/180;
    pitch01 = clamp((1-Math.cos(br))/2, 0, 1);
    vol01 = (Math.sin(gr)+1)/2;
  }
  window.addEventListener("deviceorientation", onOrient, {passive:true});

  // Pointer fallback (desktop): canvas area fills viewport; use center for neutrality
  let pointerActive=false, px=0.5, py=0.5;
  document.addEventListener("pointerdown", ev=>{ pointerActive=true; px=ev.clientX/innerWidth; py=ev.clientY/innerHeight; });
  document.addEventListener("pointermove", ev=>{ if(pointerActive){ px=ev.clientX/innerWidth; py=ev.clientY/innerHeight; }});
  document.addEventListener("pointerup", ()=>{ pointerActive=false; });
  setInterval(()=>{
    if(pointerActive){
      // Map like AERIAL: Y -> pitch, X -> volume
      pitch01 = clamp(1-py, 0, 1);
      vol01 = clamp(px, 0, 1);
    }
  }, 16);

  // Animate: scale with volume; wobble with LFO tied to pitch (approx freq 100..1800 Hz -> LFO 2..8 Hz)
  const kbFrame = document.getElementById('kbFrame');
  let t=0, sVol=0, sPitch=0;
  function loop(){
    requestAnimationFrame(loop);
    sVol = lerp(sVol, vol01, 0.1);
    sPitch = lerp(sPitch, pitch01, 0.1);
    const lfoHz = 2 + sPitch*6; // 2..8 Hz
    t += lfoHz * 0.016; // assuming ~60fps
    const wobble = Math.sin(t*2*Math.PI) * 0.015 * (0.3 + 0.7*sVol); // amplitude grows with volume
    const scale = 1 + 0.08*sVol + wobble; // base scale by volume + wobble
    const rotate = Math.sin(t*2*Math.PI+Math.PI/2) * 1.2 * sVol; // subtle rotational wobble in degrees
    kbFrame.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
    kbFrame.style.transformOrigin = "50% 50%";
  }
  loop();

</script>
</body>
</html>
