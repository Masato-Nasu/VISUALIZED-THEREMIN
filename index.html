<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KB × AERIAL Merge</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b0c10">
  <style>
    :root{ --bg:#0b0c10; --fg:#e8e8f0; }
    html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg); touch-action:manipulation; }
    #kbFrame{ position:fixed; inset:0; width:100%; height:100%; border:0; }
    #panel{ position:fixed; right:16px; bottom:16px; width:min(520px,96vw); height:min(70vh,560px);
            background:#000; border:1px solid #2a2a33; border-radius:14px; overflow:hidden;
            box-shadow:0 16px 48px rgba(0,0,0,.5); display:none; z-index:10; }
    #drag{ position:absolute; inset:0 0 auto 0; height:24px; background:#111114; color:#9aa0a6; font:12px/24px ui-sans-serif; padding-left:10px; cursor:move; z-index:11; }
    #aerialFrame{ position:absolute; inset:24px 0 0 0; width:100%; height:calc(100% - 24px); border:0; background:#0b0d11; }
    #hint{ position:fixed; right:10px; bottom:10px; font:600 12px ui-sans-serif; color:#cfd3ff; opacity:.9; background:#111114cc; padding:6px 8px; border-radius:10px; border:1px solid #2a2a33; z-index:20; }
  </style>
</head>
<body>
  <iframe id="kbFrame" src="./kb_patched.html" allow="autoplay; fullscreen"></iframe>
  <div id="panel">
    <div id="drag">AERIAL 操作パネル（二本指/長押しで表示切替・ドラッグで移動・Sキーでも可）</div>
    <iframe id="aerialFrame" src="./aerial/index.html" allow="autoplay; microphone; fullscreen; clipboard-read; clipboard-write"></iframe>
  </div>
  <div id="hint">✌ 二本指タッチ／長押し（0.8秒）／Sキー でパネル表示</div>

  <script>

    if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js"); }
    const panel = document.getElementById('panel');
    const hint = document.getElementById('hint');
    const kbFrame = document.getElementById('kbFrame');
    const aerialFrame = document.getElementById('aerialFrame');

    function setPanel(show){
      panel.style.display = show ? "block" : "none";
      hint.style.opacity = show ? 0.6 : 0.9;
    }
    function toggle(force){
      if(typeof force==="boolean"){ setPanel(force); }
      else { setPanel(panel.style.display!=="block"); }
    }

    // Initial show once then hide
    (function init(){
      setPanel(true);
      setTimeout(()=>setPanel(false), 3500);
    })();

    // Orientation permission (iOS)
    async function requestOrientationPerm(){
      try{
        if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function"){
          const r = await DeviceOrientationEvent.requestPermission();
          console.log("Orientation perm:", r);
        }
      }catch(e){}
      try{
        if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === "function"){
          const r2 = await DeviceMotionEvent.requestPermission();
          console.log("Motion perm:", r2);
        }
      }catch(e){}
      try{
        // Ask AERIAL frame to request too
        if(aerialFrame && aerialFrame.contentWindow){
          aerialFrame.contentWindow.postMessage({type:"REQ_ORIENT_PERM"}, "*");
        }
      }catch(e){}
    }
    // Trigger permission when user first interacts
    let permAsked=false;
    const askOnce = ()=>{ if(!permAsked){ permAsked=true; requestOrientationPerm(); } };
    document.addEventListener('pointerdown', askOnce, {once:true});
    document.addEventListener('touchstart', askOnce, {once:true});

    // Two-finger on wrapper
    let lastTF=0;
    document.addEventListener('touchstart', e=>{
      const now=performance.now();
      if(e.touches && e.touches.length>=2 && now-lastTF>500){ lastTF=now; toggle(); }
    }, {passive:true});

    // Aux toggles
    // Long press
    (function(){
      let timer=null;
      document.addEventListener('touchstart', e=>{
        if(e.touches && e.touches.length===1){
          timer=setTimeout(()=>toggle(), 800);
        }
      }, {passive:true});
      function cancel(){ if(timer){ clearTimeout(timer); timer=null; } }
      document.addEventListener('touchend', cancel);
      document.addEventListener('touchmove', cancel);
    })();
    // Keyboard
    document.addEventListener('keydown', e=>{ if(e.key==='s'||e.key==='S'){ toggle(); } });

    // Emergency hotspot (top-left 20x20)
    (function(){
      const spot=document.createElement('button');
      spot.textContent="⚙";
      spot.style.position="fixed"; spot.style.left="6px"; spot.style.top="6px";
      spot.style.width="24px"; spot.style.height="24px";
      spot.style.borderRadius="6px"; spot.style.border="1px solid #2a2a33";
      spot.style.background="#111114cc"; spot.style.color="#cfd3ff";
      spot.style.font="600 12px ui-sans-serif"; spot.style.zIndex="30";
      spot.style.opacity="0.5";
      spot.addEventListener('click', ()=>toggle(true));
      document.body.appendChild(spot);
    })();

    // Bridge & messaging
    window.addEventListener("message", (e)=>{
      if(e && e.data && e.data.type==="KB_TWO_FINGER"){ toggle(); }
      if(e && e.data && e.data.type==="AERIAL_LEVEL" && typeof e.data.vol==="number"){
        latestVol = Math.max(0, Math.min(1, e.data.vol));
        lastFromAerial = performance.now();
      }
      if(e && e.data && e.data.type==="REQ_ORIENT_PERM_PARENT"){ requestOrientationPerm(); }
    });

    // Volume coupling
    let latestVol = 0.0, lastFromAerial = 0;
    let envVol = 0.0;
    const ATTACK = 0.35, RELEASE = 0.06;
    function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
    function lerp(a,b,t){ return a + (b-a)*t; }

    // Fallback estimation if AERIAL hasn't reported in 250ms
    let pitch01=0, volEst=0;
    function onOrient(e){
      const br=(e.beta||0)*Math.PI/180;
      const gr=(e.gamma||0)*Math.PI/180;
      pitch01 = clamp((1-Math.cos(br))/2,0,1);
      volEst = (Math.sin(gr)+1)/2;
    }
    window.addEventListener("deviceorientation", onOrient, {passive:true});

    // Mouse fallback
    let pointerActive=false, px=0.5, py=0.5;
    document.addEventListener("pointerdown", ev=>{ pointerActive=true; px=ev.clientX/innerWidth; py=ev.clientY/innerHeight; });
    document.addEventListener("pointermove", ev=>{ if(pointerActive){ px=ev.clientX/innerWidth; py=ev.clientY/innerHeight; }});
    document.addEventListener("pointerup", ()=>{ pointerActive=false; });
    setInterval(()=>{
      if(pointerActive && performance.now()-lastFromAerial>250){
        volEst = clamp(px,0,1);
      }
    }, 16);

    // Apply scale only (no wobble/rotation/transitions)
    kbFrame.style.transition="none";
    kbFrame.style.transformOrigin="50% 50%";

    function loop(){
      requestAnimationFrame(loop);
      // Choose source
      const useVol = (performance.now()-lastFromAerial<=250) ? latestVol : volEst;
      // Envelope follower
      const coeff = (useVol>envVol) ? ATTACK : RELEASE;
      envVol = envVol + (useVol - envVol) * coeff;
      const scale = 1 + 0.16 * envVol;
      kbFrame.style.transform = `scale(${scale})`;

      // Ask AERIAL for its current level every frame
      if(aerialFrame && aerialFrame.contentWindow){
        aerialFrame.contentWindow.postMessage({type:"REQ_LEVEL"}, "*");
        // also ask it to request orientation perm if needed
        aerialFrame.contentWindow.postMessage({type:"REQ_ORIENT_PERM"}, "*");
      }
    }
    loop();

    // Inject bridge into AERIAL (same-origin assumed)
    aerialFrame.addEventListener("load", ()=>{
      try{
        const doc=aerialFrame.contentDocument;
        const s=doc.createElement("script");
        s.type="text/javascript";
        s.text = `
          (function(){
            let vol01=0;
            function onOrient(e){
              const gr=(e.gamma||0)*Math.PI/180;
              vol01 = (Math.sin(gr)+1)/2;
            }
            window.addEventListener("deviceorientation", onOrient, {passive:true});
            window.addEventListener("message", async (e)=>{
              if(e && e.data && e.data.type==="REQ_LEVEL"){
                try{ parent.postMessage({type:"AERIAL_LEVEL", vol: vol01}, "*"); }catch{}
              }
              if(e && e.data && e.data.type==="REQ_ORIENT_PERM"){
                try{
                  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function"){
                    const r = await DeviceOrientationEvent.requestPermission();
                    parent.postMessage({type:"REQ_ORIENT_PERM_PARENT", status:r}, "*");
                  }
                }catch{}
              }
            });
          })();
        `;
        doc.head.appendChild(s);
      }catch(e){}
    });

    // Inject two-finger detector directly into KB iframe (so it always posts to parent)
    kbFrame.addEventListener("load", ()=>{
      try{
        const d = kbFrame.contentDocument;
        const s = d.createElement("script");
        s.type="text/javascript";
        s.text = `
          (function(){
            let last=0;
            function on2(e){
              try{
                if(e.touches && e.touches.length>=2){
                  const now=performance.now();
                  if(now-last>500){ last=now; try{ parent.postMessage({type:"KB_TWO_FINGER"}, "*"); }catch{} }
                  e.preventDefault(); e.stopImmediatePropagation(); return false;
                }
              }catch{}
            }
            ['touchstart','touchmove','touchend','gesturestart'].forEach(tp=>{
              document.addEventListener(tp, on2, {capture:true, passive:false});
            });
          })();
        `;
        d.head.appendChild(s);
      }catch(e){}
    });

</script>
</body>
</html>
