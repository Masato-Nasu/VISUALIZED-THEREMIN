<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KB × AERIAL (Theremin)</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b0c10">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="stage">
    <canvas id="canvas"></canvas>
  </div>

  <!-- Overlay: two-finger touch to toggle -->
  <div id="hint">
    <div class="card">
      <div>二本指タッチでこの操作パネルを表示/非表示できます。<br>1回タップして開始、以降は端末の傾きで演奏。</div>
      <button id="start" class="btn">▶ サウンド開始</button>
      <div style="margin-top:8px;">
        <label class="btn" for="bgm">🎵 BGM</label>
        <input id="bgm" type="file" accept="audio/*" class="hidden">
        <button id="tap" class="btn">🔔 チャイム</button>
        <button id="rec" class="btn">● REC / ■ STOP</button>
      </div>
      <div style="margin-top:6px; font-size:12px; opacity:.8;">PCはキャンバス上のマウス移動（縦=音程／横=音量）</div>
    </div>
  </div>

  <div class="badge">✌ 二本指タッチで操作パネル</div>

  <script src="./app.js"></script>
</body>
</html>
