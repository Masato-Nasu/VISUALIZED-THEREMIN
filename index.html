<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KB × AERIAL Merge</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b0c10">
  <style>
    :root{ --bg:#0b0c10; --fg:#e8e8f0; }
    html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg); touch-action:manipulation; }
    #kbFrame{ position:fixed; inset:0; width:100%; height:100%; border:0; }
    #panel{ position:fixed; right:16px; bottom:16px; width:min(520px,96vw); height:min(70vh,560px);
            background:#000; border:1px solid #2a2a33; border-radius:14px; overflow:hidden;
            box-shadow:0 16px 48px rgba(0,0,0,.5); display:none; z-index:10; }
    #drag{ position:absolute; inset:0 0 auto 0; height:24px; background:#111114; color:#9aa0a6; font:12px/24px ui-sans-serif; padding-left:10px; cursor:move; z-index:11; }
    #aerialFrame{ position:absolute; inset:24px 0 0 0; width:100%; height:calc(100% - 24px); border:0; background:#0b0d11; }
    #hint{ position:fixed; right:10px; bottom:10px; font:600 12px ui-sans-serif; color:#cfd3ff; opacity:.9; background:#111114cc; padding:6px 8px; border-radius:10px; border:1px solid #2a2a33; z-index:20; }
  </style>
</head>
<body>
  <iframe id="kbFrame" allow="fullscreen" src="./kb_patched.html?v=16" allow="autoplay; fullscreen"></iframe>
  <div id="panel">
    <div id="drag">AERIAL 操作パネル（二本指/長押しで表示切替・ドラッグで移動・Sキーでも可）</div>
    <iframe id="aerialFrame" allow="autoplay; microphone; fullscreen" src="./aerial/index.html?v=16" allow="autoplay; microphone; fullscreen; clipboard-read; clipboard-write"></iframe>
  </div>
  <div id="hint">✌ 二本指タッチ／長押し（0.8秒）／Sキー でパネル表示</div>

  <script>

    if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js"); }
    const panel = document.getElementById('panel');
    const hint = document.getElementById('hint');
    const kbFrame = document.getElementById('kbFrame');
    const aerialFrame = document.getElementById('aerialFrame');

    function setPanel(show){ panel.style.display = show ? "block" : "none"; hint.style.opacity = show ? 0.6 : 0.9; }
    function toggle(force){ if(typeof force==="boolean"){ setPanel(force); } else { setPanel(panel.style.display!=="block"); } }

    // Brief show then hide
    (function(){ setPanel(true); setTimeout(()=>setPanel(false), 2200); })();

    // ---- Primary: Two-finger (parent) ----
    let lastTF=0;
    function parentTwoFinger(e){
      const now=performance.now();
      if(e.touches && e.touches.length>=2 && now-lastTF>350){
        lastTF=now; toggle();
        e.preventDefault(); // allow preventing when 2+
      }
    }
    document.addEventListener('touchstart', parentTwoFinger, {passive:false, capture:true});

    // Aux toggles (fallback)
    (function(){
      let t=null;
      document.addEventListener('touchstart', e=>{ if(e.touches?.length===1){ t=setTimeout(()=>toggle(), 800); } }, {passive:true});
      const cancel=()=>{ if(t){ clearTimeout(t); t=null; } };
      document.addEventListener('touchend', cancel); document.addEventListener('touchmove', cancel);
    })();
    document.addEventListener('keydown', e=>{ if(e.key==='s'||e.key==='S'){ toggle(); } });

    // Visible helpers (残すが二本指が主役)
    (function(){
      const gear=document.createElement('button');
      gear.textContent="⚙"; Object.assign(gear.style,{position:"fixed",left:"6px",top:"6px",width:"24px",height:"24px",borderRadius:"6px",border:"1px solid #2a2a33",background:"#111114cc",color:"#cfd3ff",font:"600 12px ui-sans-serif",zIndex:30,opacity:.55});
      gear.addEventListener('click', ()=>toggle(true)); document.body.appendChild(gear);
    })();

    // ---- Pitch-based scaling ----
    // Receive true pitch from AERIAL
    let envPitch=0; // smoothed 0..1 (log-mapped)
    const ATTACK=0.7, RELEASE=0.25;
    const FMIN=120, FMAX=1800;
    function hzToNorm(hz){
      const clamped=Math.max(FMIN, Math.min(FMAX, hz||FMIN));
      const n=(Math.log(clamped)-Math.log(FMIN))/(Math.log(FMAX)-Math.log(FMIN)); // 0..1
      return n;
    }
    kbFrame.style.transition="none"; kbFrame.style.transformOrigin="50% 50%";
    window.addEventListener("message", (e)=>{
      // pitch
      if(e?.data?.type==="AERIAL_PITCH_HZ" && typeof e.data.hz==="number" && e.data.hz>0){
        const target = hzToNorm(e.data.hz);
        const coeff = (target>=envPitch)? ATTACK : RELEASE;
        envPitch = envPitch + (target - envPitch) * coeff;
        const scale = 1 + 0.28*envPitch; // HIGH pitch -> bigger
        kbFrame.style.transform = `scale(${scale})`;
      }
      // still accept true level for possible future uses (ignored for scale)
      if(e?.data?.type==="AERIAL_LEVEL_TRUE" && typeof e.data.vol==="number"){ /* no-op for size */ }

      // Two-finger relays
      if(e?.data?.type==="KB_TWO_FINGER" || e?.data?.type==="AERIAL_TWO_FINGER"){ toggle(); }
    });

    // ---- Inject bridges into AERIAL & KB ----
    aerialFrame.addEventListener("load", ()=>{
      try{
        const d=aerialFrame.contentDocument;
        const s=d.createElement("script");
        s.type="text/javascript";
        s.text = `
          (function(){
            // 1) Two-finger detector in AERIAL
            (function(){
              let last=0;
              function on2(e){
                if(e.touches && e.touches.length>=2){
                  const now=performance.now();
                  if(now-last>350){ last=now; try{ parent.postMessage({type:"AERIAL_TWO_FINGER"}, "*"); }catch{} }
                  e.preventDefault(); e.stopImmediatePropagation(); return false;
                }
              }
              ['touchstart','touchmove','touchend','gesturestart'].forEach(tp=>{
                document.addEventListener(tp, on2, {capture:true, passive:false});
              });
            })();

            // 2) True audio tapping + pitch estimation (autocorrelation)
            let analyser=null, hooked=false, ctx=null;
            function postLoop(analyser, ctx){
              const N=2048;
              const buf=new Float32Array(N);
              const sr=ctx.sampleRate||48000;
              const post=()=>{
                analyser.getFloatTimeDomainData(buf);
                // Auto-correlation (basic) to estimate fundamental
                let rms=0; for(let i=0;i<N;i++){ const v=buf[i]; rms+=v*v; }
                rms=Math.sqrt(rms/N);
                if(rms<0.01){ requestAnimationFrame(post); return; } // too quiet
                // Remove DC
                let mean=0; for(let i=0;i<N;i++){ mean+=buf[i]; } mean/=N;
                for(let i=0;i<N;i++){ buf[i]-=mean; }
                let bestOffset=-1, bestCorr=0;
                let lastCorr=1;
                for(let offset=20; offset< N/2; offset++){
                  let corr=0;
                  for(let i=0;i<N-offset;i++){ corr += buf[i]*buf[i+offset]; }
                  corr/= (N-offset);
                  if(corr>bestCorr){ bestCorr=corr; bestOffset=offset; }
                  if(corr>0.99 && lastCorr<0.99){ /* pass */ }
                  lastCorr=corr;
                }
                let freq=0;
                if(bestOffset>0){ freq = sr / bestOffset; }
                if(freq>0){
                  try{ parent.postMessage({type:"AERIAL_PITCH_HZ", hz: freq}, "*"); }catch{}
                }
                // Also derive level (RMS) if needed
                const level = Math.max(0, Math.min(1, rms*3.0));
                try{ parent.postMessage({type:"AERIAL_LEVEL_TRUE", vol: level}, "*"); }catch{}
                requestAnimationFrame(post);
              };
              requestAnimationFrame(post);
            }
            function tryHook(){
              const cands=[window.masterGain, window.master, window.MainGain, window.master_out, window.gMaster];
              for(const g of cands){
                try{
                  if(g && g.context && g.gain){
                    ctx=g.context;
                    analyser = ctx.createAnalyser(); analyser.fftSize=2048;
                    // Tee at master
                    const tee=ctx.createGain(); tee.gain.value=1;
                    try{ g.disconnect(); }catch{}
                    g.connect(tee); tee.connect(ctx.destination); tee.connect(analyser);
                    hooked=true; postLoop(analyser, ctx); return true;
                  }
                }catch{}
              }
              return false;
            }
            if(!tryHook()){
              const _connect=AudioNode.prototype.connect;
              AudioNode.prototype.connect=function(){
                try{
                  const ctx=this.context;
                  for(let i=0;i<arguments.length;i++){
                    if(arguments[i] && arguments[i]===ctx.destination && !hooked){
                      const tee=ctx.createGain(); tee.gain.value=1.0;
                      _connect.call(this, tee);
                      _connect.call(tee, ctx.destination);
                      analyser = ctx.createAnalyser(); analyser.fftSize=2048;
                      _connect.call(tee, analyser);
                      hooked=true; postLoop(analyser, ctx);
                      return;
                    }
                  }
                }catch{}
                return _connect.apply(this, arguments);
              };
            }
          })();
        `;
        d.head.appendChild(s);
      }catch{}
    });

    // KB iframe: two-finger detector that doesn't block single touch
    kbFrame.addEventListener("load", ()=>{
      try{
        const d=kbFrame.contentDocument;
        const s=d.createElement("script");
        s.type="text/javascript";
        s.text = `
          (function(){
            let last=0;
            function on2(e){
              if(e.touches && e.touches.length>=2){
                const now=performance.now();
                if(now-last>350){ last=now; try{ parent.postMessage({type:"KB_TWO_FINGER"}, "*"); }catch{} }
                e.preventDefault(); e.stopImmediatePropagation(); return false;
              }
            }
            ['touchstart','touchmove','touchend','gesturestart'].forEach(tp=>{
              document.addEventListener(tp, on2, {capture:true, passive:false});
            });
          })();
        `;
        d.head.appendChild(s);
      }catch{}
    });

</script>
</body>
</html>
