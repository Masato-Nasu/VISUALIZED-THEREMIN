<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'><style>html,body{margin:0;height:100%;background:#0b0c10;touch-action:none}canvas{position:fixed;inset:0;display:block}</style><canvas id=cv></canvas><script>const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{alpha:false});function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}addEventListener('resize',fit,{passive:true});fit();let env=0;addEventListener('message',e=>{if(e?.data?.type==='PITCH_NORM'&&typeof e.data.v==='number') env=Math.max(0,Math.min(1,e.data.v));});const C=['#87c7ff','#39FF14','#FFD166','#FF4D6D','#9D4DFF'],T=['circle','triangle','square','star','heart'];const S=[];function star(r,s=5){const p=new Path2D(),st=Math.PI/s;p.moveTo(r,0);for(let i=0;i<s*2;i++){const rr=(i%2===0)?r:r*0.45,a=i*st;p.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}p.closePath();return p}const SC=new Map();function gStar(r){const k=r|0;if(!SC.has(k))SC.set(k,star(k));return SC.get(k)}function reset(){S.length=0;for(let i=0;i<20;i++){const t=T[i%T.length],r=60*(0.6+Math.random()*0.7),x=Math.random()*cv.width,y=Math.random()*cv.height,rot=Math.random()*Math.PI*2,vx=(Math.random()-0.5)*0.5,vy=(Math.random()-0.5)*0.5,col=C[i%C.length];S.push({t,x,y,r,rot,vx,vy,col})}}reset();function stroke(t,r){switch(t){case'circle':ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();break;case'triangle':ctx.beginPath();const h=r*1.1;ctx.moveTo(0,-h);ctx.lineTo(h*Math.sin(Math.PI/3),h*Math.cos(Math.PI/3));ctx.lineTo(-h*Math.sin(Math.PI/3),h*Math.cos(Math.PI/3));ctx.closePath();ctx.stroke();break;case'square':ctx.strokeRect(-r,-r,r*2,r*2);break;case'star':ctx.stroke(gStar(r));break}}(function loop(){const w=cv.width,h=cv.height;ctx.fillStyle='#0b0c10';ctx.fillRect(0,0,w,h);for(const s of S){s.x+=s.vx;s.y+=s.vy;s.rot+=0.008;if(s.x<s.r){s.x=s.r;s.vx=Math.abs(s.vx)}if(s.x>w-s.r){s.x=w-s.r;s.vx=-Math.abs(s.vx)}if(s.y<s.r){s.y=s.r;s.vy=Math.abs(s.vy)}if(s.y>h-s.r){s.y=h-s.r;s.vy=-Math.abs(s.vy)}s.vx*=0.992;s.vy*=0.992;const base=s.r,sc=1+env*0.35,r=base*sc;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowColor=s.col;ctx.shadowBlur=30;ctx.strokeStyle=s.col;ctx.lineWidth=8;stroke(s.t,r);ctx.shadowBlur=12;ctx.strokeStyle='#fff';ctx.lineWidth=3;stroke(s.t,r);ctx.restore()}requestAnimationFrame(loop)})();</script>
