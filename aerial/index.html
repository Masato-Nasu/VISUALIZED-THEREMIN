<script>
(function(){
  let audioCtx = null;
  let analyser = null;
  let teeGain = null;
  let hooked = false;

  function setupFromMasterGain(g){
    try{
      const ctx = (g && g.context) || (window.audioCtx) || (window.ctx) || null;
      if(!ctx) return false;
      audioCtx = ctx;
      analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      const capture = new Float32Array(analyser.fftSize);
      // Tee after master gain
      const tee = ctx.createGain(); tee.gain.value = 1.0;
      g.disconnect();
      g.connect(tee);
      tee.connect(ctx.destination);
      tee.connect(analyser);
      teeGain = tee;
      hooked = true;
      // periodic post
      setInterval(()=>{
        if(!analyser) return;
        analyser.getFloatTimeDomainData(capture);
        // RMS
        let sum=0; for(let i=0;i<capture.length;i++){ const v=capture[i]; sum += v*v; }
        const rms = Math.sqrt(sum/capture.length); // 0..~0.7
        // Soft-knee map to 0..1
        const level = Math.max(0, Math.min(1, rms*3.0));
        try{ parent.postMessage({type:"AERIAL_LEVEL_TRUE", vol: level}, "*"); }catch{}
      }, 50);
      return true;
    }catch(e){ return false; }
  }

  function tryHook(){
    // Common global names
    const candidates = [window.masterGain, window.master, window.MainGain, window.master_out, window.gMaster];
    for(const g of candidates){ if(g && g.gain && g.context){ if(setupFromMasterGain(g)) return true; } }
    // Search in window for GainNodes (best-effort)
    for(const k in window){
      try{ const obj = window[k];
        if(obj && obj.gain && obj.context && typeof obj.connect==='function' && obj.context.createGain){
          if(setupFromMasterGain(obj)) return true;
        }
      }catch{}
    }
    return false;
  }

  // If we can't find masterGain, monkey-patch AudioNode.connect before late connects
  if(!tryHook()){
    const _connect = AudioNode.prototype.connect;
    AudioNode.prototype.connect = function(){
      try{
        const ctx = this.context || (arguments[0] && arguments[0].context) || null;
        if(!hooked && ctx){
          audioCtx = ctx;
          if(!analyser){
            analyser = ctx.createAnalyser();
            analyser.fftSize = 512;
          }
          // If connecting to destination, insert a tee
          for(let i=0;i<arguments.length;i++){
            if(arguments[i] && arguments[i] === ctx.destination){
              const tee = ctx.createGain(); tee.gain.value = 1.0;
              // Rewire: this -> tee -> destination
              _connect.call(this, tee);
              _connect.call(tee, ctx.destination);
              _connect.call(tee, analyser);
              teeGain = tee; hooked = true;
              // Start posting level
              const capture = new Float32Array(analyser.fftSize);
              setInterval(()=>{
                if(!analyser) return;
                analyser.getFloatTimeDomainData(capture);
                let sum=0; for(let j=0;j<capture.length;j++){ const v=capture[j]; sum += v*v; }
                const rms = Math.sqrt(sum/capture.length);
                const level = Math.max(0, Math.min(1, rms*3.0));
                try{ parent.postMessage({type:"AERIAL_LEVEL_TRUE", vol: level}, "*"); }catch{}
              }, 50);
              return;
            }
          }
        }
      }catch(e){}
      return _connect.apply(this, arguments);
    };
  }

  // Respond to parent polling (compat)
  window.addEventListener("message", (e)=>{
    if(e && e.data && e.data.type==="REQ_LEVEL"){
      // no-op: we push on interval; also send once immediately
      try{ parent.postMessage({type:"AERIAL_LEVEL_TRUE_PING"}, "*"); }catch{}
    }
  });
})();
